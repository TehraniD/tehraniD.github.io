<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIO 189 Module 3 Jeopardy!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0d1f3c 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .splash-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #1a2a4a 0%, #0a1628 70%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .splash-screen.hidden { opacity: 0; pointer-events: none; }

        .splash-logo {
            font-size: 5em;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.6), 3px 3px 6px rgba(0,0,0,0.8);
            letter-spacing: 8px;
            animation: pulseGlow 2s ease-in-out infinite;
            margin-bottom: 20px;
        }

        .splash-subtitle {
            font-size: 1.5em;
            color: #8ab4f8;
            margin-bottom: 10px;
        }

        .splash-course {
            font-size: 1.1em;
            color: #aaa;
            margin-bottom: 40px;
        }

        .splash-btn {
            padding: 18px 50px;
            font-size: 1.4em;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
        }

        .splash-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 30px rgba(255, 215, 0, 0.6);
        }

        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 30px rgba(255,215,0,0.6), 3px 3px 6px rgba(0,0,0,0.8); }
            50% { text-shadow: 0 0 50px rgba(255,215,0,0.9), 3px 3px 6px rgba(0,0,0,0.8); }
        }

        .game-container { display: none; padding: 15px; max-width: 1500px; margin: 0 auto; }
        .game-container.active { display: block; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .top-bar h1 {
            font-size: 2.2em;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 4px;
        }

        .round-indicator {
            font-size: 1.1em;
            color: #8ab4f8;
            background: rgba(255,255,255,0.08);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(138, 180, 248, 0.3);
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .ctrl-btn {
            padding: 8px 18px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            background: rgba(255,255,255,0.1);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ctrl-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }

        .ctrl-btn.gold {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
            border: none;
            font-weight: bold;
        }

        .ctrl-btn.gold:hover { box-shadow: 0 0 15px rgba(255,215,0,0.5); }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .team {
            background: linear-gradient(135deg, rgba(50,70,120,0.8), rgba(30,50,90,0.8));
            padding: 12px 15px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid rgba(255,215,0,0.3);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .team.active {
            border-color: #00e676;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
        }

        .team h3 { font-size: 1.1em; color: #ffd700; margin-bottom: 5px; }
        .team .score { font-size: 1.8em; font-weight: bold; }

        .team .score-controls {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
        }

        .score-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .score-btn:hover { background: rgba(255,255,255,0.25); }

        .board {
            background: rgba(0,0,0,0.6);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,215,0,0.15);
        }

        .category-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .category-header {
            background: linear-gradient(180deg, #0055aa, #003d7a);
            padding: 15px 8px;
            text-align: center;
            font-size: 0.85em;
            font-weight: bold;
            border-radius: 8px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.3;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .question-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .cell {
            background: linear-gradient(180deg, #1a3a7a, #0d2555);
            padding: 18px 8px;
            text-align: center;
            font-size: 1.6em;
            font-weight: bold;
            color: #ffd700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s;
            border: 1px solid rgba(255,215,0,0.15);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .cell:hover:not(.used) {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,215,0,0.4);
            border-color: #ffd700;
        }

        .cell.used {
            background: rgba(20,30,50,0.6);
            color: rgba(255,255,255,0.1);
            cursor: default;
            border-color: transparent;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: linear-gradient(135deg, #0d2555, #1a3a7a);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 60px rgba(255,215,0,0.3);
            animation: modalIn 0.4s ease;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-category {
            font-size: 0.9em;
            color: #8ab4f8;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .modal-value {
            font-size: 2.5em;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }

        .modal-question {
            font-size: 1.4em;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #e8e8e8;
            padding: 0 10px;
        }

        .modal-question em { color: #8ab4f8; font-style: italic; }

        .modal-answer {
            background: rgba(0,230,118,0.1);
            border: 2px solid #00e676;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: none;
            animation: revealAnswer 0.5s ease;
        }

        .modal-answer.visible { display: block; }

        @keyframes revealAnswer {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-answer h4 {
            color: #00e676;
            font-size: 1em;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .modal-answer p {
            font-size: 1.3em;
            color: #fff;
            font-weight: bold;
        }

        .modal-answer .explanation {
            font-size: 0.85em;
            color: #aaa;
            margin-top: 10px;
            font-weight: normal;
            line-height: 1.5;
        }

        .modal-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

        .modal-btn {
            padding: 12px 30px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .btn-reveal {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
        }

        .btn-reveal:hover { box-shadow: 0 0 20px rgba(255,215,0,0.5); }

        .btn-correct {
            background: linear-gradient(135deg, #00e676, #00c853);
            color: #1a1a2e;
        }

        .btn-wrong {
            background: linear-gradient(135deg, #ff5252, #d32f2f);
            color: #fff;
        }

        .btn-close {
            background: rgba(255,255,255,0.15);
            color: #ccc;
        }

        .btn-close:hover { background: rgba(255,255,255,0.25); }

        .daily-double-flash {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse, #ffd700, #ff8800);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            animation: ddFlash 1.5s ease-in-out forwards;
        }

        .daily-double-flash.active { display: flex; }

        .daily-double-flash h1 {
            font-size: 5em;
            color: #1a1a2e;
            text-shadow: 3px 3px 0 rgba(255,255,255,0.3);
            letter-spacing: 8px;
        }

        @keyframes ddFlash {
            0% { transform: scale(0.5); opacity: 0; }
            30% { transform: scale(1.1); opacity: 1; }
            70% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .final-container {
            display: none;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .final-container.active { display: block; }

        .final-container h1 {
            font-size: 3em;
            color: #ffd700;
            margin-bottom: 10px;
            letter-spacing: 5px;
        }

        .final-category {
            font-size: 1.5em;
            color: #8ab4f8;
            margin-bottom: 30px;
        }

        .final-question {
            font-size: 1.4em;
            line-height: 1.7;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            border: 2px solid rgba(255,215,0,0.2);
        }

        .final-answer-box {
            background: rgba(0,230,118,0.1);
            border: 2px solid #00e676;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            display: none;
        }

        .final-answer-box.visible { display: block; }

        .final-answer-box h4 { color: #00e676; margin-bottom: 8px; letter-spacing: 2px; }
        .final-answer-box p { font-size: 1.4em; font-weight: bold; }
        .final-answer-box .explanation { font-size: 0.9em; color: #aaa; margin-top: 10px; line-height: 1.5; }

        .footer {
            text-align: center;
            padding: 30px;
            color: #555;
            font-size: 0.85em;
        }

        .footer a { color: #8ab4f8; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .splash-logo { font-size: 3em; }
            .top-bar h1 { font-size: 1.4em; }
            .category-header { font-size: 0.65em; min-height: 55px; padding: 8px 4px; }
            .cell { font-size: 1em; padding: 12px 4px; }
            .modal { padding: 25px; }
            .modal-question { font-size: 1.1em; }
            .modal-value { font-size: 1.8em; }
        }
    </style>
</head>
<body>

<div class="splash-screen" id="splash">
    <div class="splash-logo">JEOPARDY!</div>
    <div class="splash-subtitle">BIO 189 &mdash; Module 3</div>
    <div class="splash-course">Fundamentals of Biology &middot; Energy and Metabolism</div>
    <button class="splash-btn" onclick="startGame()">START GAME</button>
</div>

<div class="game-container" id="gameContainer">
    <div class="top-bar">
        <h1>JEOPARDY!</h1>
        <div class="round-indicator" id="roundIndicator">Round 1 of 2</div>
        <div class="controls">
            <button class="ctrl-btn" onclick="resetGame()">Reset</button>
            <button class="ctrl-btn gold" id="nextRoundBtn" onclick="nextRound()" style="display:none;">Round 2 &raquo;</button>
            <button class="ctrl-btn gold" id="finalBtn" onclick="startFinalJeopardy()" style="display:none;">Final Jeopardy!</button>
        </div>
    </div>

    <div class="scoreboard" id="scoreboard"></div>
    <div class="board" id="board"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-category" id="modalCategory"></div>
        <div class="modal-value" id="modalValue"></div>
        <div class="modal-question" id="modalQuestion"></div>
        <div class="modal-answer" id="modalAnswer">
            <h4>ANSWER</h4>
            <p id="modalAnswerText"></p>
            <div class="explanation" id="modalExplanation"></div>
        </div>
        <div class="modal-buttons" id="modalButtons">
            <button class="modal-btn btn-reveal" id="revealBtn" onclick="revealAnswer()">Show Answer</button>
            <button class="modal-btn btn-correct" id="correctBtn" style="display:none;" onclick="markCorrect()">Correct &#10003;</button>
            <button class="modal-btn btn-wrong" id="wrongBtn" style="display:none;" onclick="markWrong()">Wrong &#10007;</button>
            <button class="modal-btn btn-close" onclick="closeModal()">Close</button>
        </div>
    </div>
</div>

<div class="daily-double-flash" id="ddFlash">
    <h1>DAILY DOUBLE!</h1>
</div>

<div class="final-container" id="finalContainer">
    <h1>FINAL JEOPARDY!</h1>
    <div class="final-category" id="finalCategory"></div>
    <div class="final-question" id="finalQuestion"></div>
    <div class="final-answer-box" id="finalAnswerBox">
        <h4>ANSWER</h4>
        <p id="finalAnswerText"></p>
        <div class="explanation" id="finalExplanation"></div>
    </div>
    <div class="modal-buttons">
        <button class="modal-btn btn-reveal" id="finalRevealBtn" onclick="revealFinalAnswer()">Show Answer</button>
        <button class="modal-btn btn-close" onclick="backToBoard()">Back to Board</button>
    </div>
</div>

<div class="footer" id="footerArea">
    &copy; BIO 189 Fundamentals of Biology &middot; <a href="https://tehranilabs.org">TehraniLabs.org</a>
</div>

<script>
const ROUND1 = {
    categories: [
        "Energy & Reactions",
        "Enzyme Central",
        "Building & Breaking",
        "Transport Station",
        "Osmosis & Tonicity"
],
    questions: [
        [
            { "q": "The textbook defines energy as the capacity to do THIS.", "a": "Work", "ex": "Not 'the ability to create energy' \u2014 energy is never created, only converted. Capacity to do work is the definition." },
            { "q": "In a chemical equation, everything sitting on the LEFT side of the arrow.", "a": "Reactants", "ex": "Ingredients go in on the left; the recipe is read left to right." },
            { "q": "Everything appearing on the RIGHT side of a chemical equation's arrow.", "a": "Products", "ex": "What comes out of the reaction is what sits right of the arrow." },
            { "q": "In C6H12O6 + 6O2 --> 6CO2 + 6H2O + ATP, carbon dioxide is a reactant or a product?", "a": "A product", "ex": "CO2 appears only on the right side \u2014 judge position within THIS equation." },
            { "q": "The first law of thermodynamics says energy can neither be created nor THIS.", "a": "Destroyed", "ex": "Energy only changes form, and every conversion leaks a little as heat." }
        ],
        [
            { "q": "Most enzymes belong to this class of macromolecule.", "a": "Proteins", "ex": "Not fats, not steroids \u2014 the catalytic workforce is protein." },
            { "q": "An enzyme's function is to speed up a particular reaction without being THIS.", "a": "Changed (consumed) by the reaction", "ex": "The catalyst emerges untouched \u2014 never a reactant, never a product." },
            { "q": "The specific reactant an enzyme acts upon.", "a": "The substrate", "ex": "One enzyme, one substrate (family) \u2014 the locksmith has one key." },
            { "q": "The pocket where the enzyme bonds to its substrate.", "a": "The active site", "ex": "Substrate docks at the active site, reaction happens, product leaves." },
            { "q": "Temperature, pH, and substrate concentration all change enzyme rate. THIS factor does NOT.", "a": "Atmospheric pressure", "ex": "TPS report: Temperature, pH, Substrate. Air pressure never makes the list." }
        ],
        [
            { "q": "This reaction joins two monomers by forming a covalent bond between them.", "a": "A condensation reaction", "ex": "Also called dehydration synthesis \u2014 monomers bond, water leaves." },
            { "q": "Condensation reactions release THIS small molecule every time a bond forms.", "a": "Water", "ex": "That is where the 'dehydration' in dehydration synthesis comes from." },
            { "q": "The reverse of condensation \u2014 water is used to break a polymer back into monomers.", "a": "Hydrolysis", "ex": "Hydro = water, lysis = breaking. Digestion is one long hydrolysis." },
            { "q": "The general name for what enzymes are, because they speed reactions without being used up.", "a": "Catalysts", "ex": "Catalysts lower activation energy and remain unchanged." },
            { "q": "Metabolism is defined as the sum of all of THESE in an organism.", "a": "Chemical reactions", "ex": "Every build-up and breakdown your cells run, added together = metabolism." }
        ],
        [
            { "q": "This class of transport uses ATP to move substances against their gradient.", "a": "Active transport", "ex": "Moving uphill costs energy \u2014 active transport pays ATP for the climb." },
            { "q": "This famous ATP-powered pump shuttles sodium and potassium ions across the cell membrane.", "a": "The sodium-potassium pump", "ex": "3 Na+ out, 2 K+ in, one ATP spent per cycle \u2014 nerves could not fire without it." },
            { "q": "Osmosis, simple diffusion, and facilitated diffusion all belong to this ATP-free class.", "a": "Passive transport", "ex": "Down the gradient costs nothing \u2014 the cell pays zero ATP." },
            { "q": "'Cell eating' \u2014 the cell engulfs large particles into a vesicle using ATP.", "a": "Phagocytosis", "ex": "White blood cells phagocytose bacteria. Think Pac-Man with a membrane." },
            { "q": "This process exports cargo out of the cell by fusing a vesicle with the membrane.", "a": "Exocytosis", "ex": "The opposite of endocytosis \u2014 vesicle docks, contents spill outside." }
        ],
        [
            { "q": "Osmosis is the passive movement of THIS across a semipermeable membrane.", "a": "Water", "ex": "Solute stays put; water is what actually crosses." },
            { "q": "During osmosis, water always moves toward the side with MORE of this.", "a": "Solute", "ex": "Water chases saltiness \u2014 it dilutes the concentrated side." },
            { "q": "A red blood cell containing 2% salt is placed into a 1% salt solution. The cell will do THIS.", "a": "Swell and possibly burst", "ex": "Outside is less salty (hypotonic) \u2014 water rushes IN and the cell can lyse." },
            { "q": "That 1% solution is hypotonic, isotonic, or hypertonic relative to the cell?", "a": "Hypotonic", "ex": "Hypo = lower solute outside. Think hippo: the cell swells huge." },
            { "q": "IV bags use saline at THIS percentage because it is isotonic to blood and keeps red cells safe.", "a": "0.9% (normal saline)", "ex": "Isotonic = no net water movement = cells neither burst nor shrivel." }
        ]
    ]
};

const ROUND2 = {
    categories: [
        "ATP & Feedback",
        "Glycolysis",
        "Krebs Korner",
        "The ETC",
        "Fermentation Station"
],
    questions: [
        [
            { "q": "The currency of the cell's energy economy.", "a": "ATP", "ex": "Glucose is the savings account; ATP is the spendable cash." },
            { "q": "ATP transfers energy to other molecules by handing off THIS.", "a": "A phosphate group", "ex": "P for Payment \u2014 the terminal phosphate is the spendable part." },
            { "q": "After spending its terminal phosphate, ATP becomes THIS lower-energy molecule.", "a": "ADP", "ex": "Adenosine DIphosphate = two phosphates left. A spent bill awaiting reload." },
            { "q": "Respiration reloads ADP back into ATP by adding THIS back on.", "a": "A phosphate group", "ex": "ATP and ADP cycle thousands of times per second in active cells." },
            { "q": "The product of a metabolic pathway slowing or stopping its own pathway is called THIS.", "a": "Feedback inhibition", "ex": "The thermostat of metabolism \u2014 plenty of product hits the brakes." }
        ],
        [
            { "q": "Glycolysis splits one glucose molecule into THIS many pyruvate molecules.", "a": "2", "ex": "Glucose has 6 carbons; two pyruvates carry 3 each." },
            { "q": "The NET ATP gain from glycolysis per glucose.", "a": "A net of 2 ATP", "ex": "4 ATP made, 2 ATP spent \u2014 the profit is 2." },
            { "q": "Glycolysis takes place in THIS part of the cell.", "a": "The cytoplasm (cytosol)", "ex": "No mitochondria needed \u2014 glycolysis is cytosolic and ancient." },
            { "q": "True or false: glycolysis requires oxygen.", "a": "False", "ex": "Glycolysis is anaerobic \u2014 it ran for eons before oxygen filled the sky." },
            { "q": "Glycolysis makes 4 ATP but spends THIS many, leaving the net of 2.", "a": "2", "ex": "Invest 2, earn 4, profit 2 \u2014 even metabolism runs on startup capital." }
        ],
        [
            { "q": "The citric acid (Krebs) cycle begins when THIS molecule enters.", "a": "Acetyl-CoA", "ex": "Pyruvate is trimmed down to Acetyl-CoA before the cycle starts turning." },
            { "q": "When pyruvate becomes Acetyl-CoA, THIS gas is released.", "a": "CO2", "ex": "One carbon leaves as carbon dioxide \u2014 the exhale begins here." },
            { "q": "The cycle's electron-carrier 'receipts' \u2014 THESE two molecules carry electrons to the ETC.", "a": "NADH and FADH2", "ex": "Every turn of the cycle banks NADH and FADH2 for the big payout." },
            { "q": "Name one product the citric acid cycle releases besides the electron carriers.", "a": "CO2 (also ATP)", "ex": "The full ledger: Acetyl-CoA in; NADH, FADH2, CO2, and ATP out." },
            { "q": "The citric acid cycle runs inside THIS organelle.", "a": "The mitochondria", "ex": "Glycolysis in the cytosol; Krebs and the ETC in the mitochondria." }
        ],
        [
            { "q": "The final electron acceptor of oxidative phosphorylation.", "a": "Oxygen (O2)", "ex": "Oxygen waits at the end of the chain to accept the spent electrons." },
            { "q": "Oxygen accepts electrons (with H+) and becomes THIS at the END of the electron transport chain.", "a": "Water", "ex": "This is exactly why you breathe: O2 in, H2O made." },
            { "q": "The electron transport chain sits in THIS mitochondrial location.", "a": "The inner mitochondrial membrane", "ex": "The folded cristae pack maximum chain machinery into minimum space." },
            { "q": "The approximate total ATP harvested from one glucose through full aerobic respiration.", "a": "About 36-38 ATP", "ex": "Versus only 2 from glycolysis alone \u2014 oxygen multiplies the payoff." },
            { "q": "THESE two electron carriers, made in glycolysis and the Krebs cycle, deliver electrons to the ETC.", "a": "NADH and FADH2", "ex": "They are the armored cars delivering electron deposits to the chain." }
        ],
        [
            { "q": "Fermentation occurs when THIS molecule is absent.", "a": "Oxygen", "ex": "Anaerobic = without oxygen \u2014 that is the definition of fermentation." },
            { "q": "In oxygen-starved human muscle cells, pyruvate is converted into THIS.", "a": "Lactate", "ex": "M for Muscles, L for Lactate \u2014 yeast makes ethanol, we make lactate." },
            { "q": "Yeast ferments pyruvate into ethanol and THIS gas that makes bread rise.", "a": "CO2", "ex": "Alcoholic fermentation = ethanol + carbon dioxide. Bakers and brewers owe yeast everything." },
            { "q": "Both fermentation pathways regenerate THIS molecule so glycolysis can keep running.", "a": "NAD+", "ex": "Without NAD+ reloading, glycolysis stalls \u2014 fermentation is life support, not profit." },
            { "q": "A rising blood level of THIS fermentation product is a clinical warning of tissue oxygen starvation.", "a": "Lactate (lactic acid)", "ex": "Lactic acidosis tracks sepsis, shock, and cardiac arrest \u2014 same pathway, worse stakes." }
        ]
    ]
};

const FINAL = {
    "category": "The Oxygen Payoff",
    "q": "Two cells each process one glucose. Cell A has no oxygen and must ferment. Cell B has plenty of oxygen. For Cell B, name: the two outputs of glycolysis (products and net ATP), the molecule that enters the citric acid cycle, the final electron acceptor at the end of the chain, AND the total ATP yield.",
    "a": "2 pyruvate and net 2 ATP; Acetyl-CoA enters the cycle; oxygen (O2) is the final electron acceptor; about 36-38 ATP total",
    "ex": "The whole aerobic story in one answer: glycolysis skims 2 ATP in the cytosol, Acetyl-CoA feeds the Krebs cycle for electron receipts, O2 signs for electrons at the end of the ETC (making water), and the full run pays about 36-38 ATP versus Cell A's lonely 2."
};

let teams = [];
let currentRound = 1;
let currentValue = 0;
let usedCells = { 1: new Set(), 2: new Set() };
let dailyDoubles = { 1: null, 2: null };

function initTeams() {
    teams = [
        { name: "Team 1", score: 0 },
        { name: "Team 2", score: 0 },
        { name: "Team 3", score: 0 },
        { name: "Team 4", score: 0 }
    ];
}

function renderScoreboard() {
    const sb = document.getElementById('scoreboard');
    sb.innerHTML = teams.map((t, i) => `
        <div class="team ${i === 0 ? 'active' : ''}" onclick="selectTeam(${i})" id="team${i}">
            <h3 contenteditable="true" onblur="renameTeam(${i}, this.textContent)">${t.name}</h3>
            <div class="score" id="score${i}">$${t.score}</div>
            <div class="score-controls">
                <button class="score-btn" onclick="event.stopPropagation(); adjustScore(${i}, -100)">-</button>
                <button class="score-btn" onclick="event.stopPropagation(); adjustScore(${i}, 100)">+</button>
            </div>
        </div>
    `).join('');
}

function selectTeam(idx) {
    document.querySelectorAll('.team').forEach(t => t.classList.remove('active'));
    document.getElementById('team' + idx).classList.add('active');
}

function renameTeam(idx, name) {
    teams[idx].name = name.trim() || `Team ${idx + 1}`;
}

function adjustScore(idx, amount) {
    teams[idx].score += amount;
    document.getElementById('score' + idx).textContent = '$' + teams[idx].score;
}

function getActiveTeam() {
    const active = document.querySelector('.team.active');
    if (!active) return 0;
    return parseInt(active.id.replace('team', ''));
}

function pickDailyDoubles() {
    dailyDoubles[1] = Math.floor(Math.random() * 25);
    dailyDoubles[2] = Math.floor(Math.random() * 25);
}

function renderBoard(roundNum) {
    const data = roundNum === 1 ? ROUND1 : ROUND2;
    const values = [200, 400, 600, 800, 1000];
    const board = document.getElementById('board');

    let html = '<div class="category-row">';
    data.categories.forEach(cat => {
        html += `<div class="category-header">${cat}</div>`;
    });
    html += '</div>';

    for (let row = 0; row < 5; row++) {
        html += '<div class="question-row">';
        for (let col = 0; col < 5; col++) {
            const flatIdx = row * 5 + col;
            const used = usedCells[roundNum].has(flatIdx);
            html += `<div class="cell ${used ? 'used' : ''}" onclick="openQuestion(${roundNum}, ${col}, ${row}, ${values[row]}, ${flatIdx})">$${values[row]}</div>`;
        }
        html += '</div>';
    }

    board.innerHTML = html;
}

function startGame() {
    document.getElementById('splash').classList.add('hidden');
    document.getElementById('gameContainer').classList.add('active');
    initTeams();
    pickDailyDoubles();
    renderScoreboard();
    renderBoard(1);
}

function openQuestion(roundNum, catIdx, qIdx, value, flatIdx) {
    if (usedCells[roundNum].has(flatIdx)) return;
    usedCells[roundNum].add(flatIdx);
    currentValue = value;
    renderBoard(roundNum);

    const data = roundNum === 1 ? ROUND1 : ROUND2;
    const qData = data.questions[catIdx][qIdx];

    if (flatIdx === dailyDoubles[roundNum]) {
        showDailyDouble(data.categories[catIdx], value, qData);
    } else {
        showQuestionModal(data.categories[catIdx], value, qData, false);
    }
}

function showDailyDouble(category, value, qData) {
    const dd = document.getElementById('ddFlash');
    dd.classList.add('active');
    setTimeout(() => {
        dd.classList.remove('active');
        showQuestionModal(category, value, qData, true);
    }, 2000);
}

function showQuestionModal(category, value, qData, isDD) {
    document.getElementById('modalCategory').textContent = category;
    document.getElementById('modalValue').textContent = isDD ? 'DAILY DOUBLE!' : '$' + value;
    document.getElementById('modalQuestion').innerHTML = qData.q;
    document.getElementById('modalAnswerText').textContent = qData.a;
    document.getElementById('modalExplanation').textContent = qData.ex;
    document.getElementById('modalAnswer').classList.remove('visible');
    document.getElementById('revealBtn').style.display = '';
    document.getElementById('correctBtn').style.display = 'none';
    document.getElementById('wrongBtn').style.display = 'none';
    document.getElementById('modalOverlay').classList.add('active');
}

function revealAnswer() {
    document.getElementById('modalAnswer').classList.add('visible');
    document.getElementById('revealBtn').style.display = 'none';
    document.getElementById('correctBtn').style.display = '';
    document.getElementById('wrongBtn').style.display = '';
}

function markCorrect() {
    const idx = getActiveTeam();
    teams[idx].score += currentValue;
    document.getElementById('score' + idx).textContent = '$' + teams[idx].score;
    closeModal();
}

function markWrong() {
    const idx = getActiveTeam();
    teams[idx].score -= currentValue;
    document.getElementById('score' + idx).textContent = '$' + teams[idx].score;
    closeModal();
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    checkRoundComplete();
}

function checkRoundComplete() {
    if (currentRound === 1 && usedCells[1].size === 25) {
        document.getElementById('nextRoundBtn').style.display = '';
    }
    if (currentRound === 2 && usedCells[2].size === 25) {
        document.getElementById('finalBtn').style.display = '';
    }
}

function nextRound() {
    currentRound = 2;
    document.getElementById('roundIndicator').textContent = 'Round 2 of 2';
    document.getElementById('nextRoundBtn').style.display = 'none';
    renderBoard(2);
}

function startFinalJeopardy() {
    document.getElementById('gameContainer').classList.remove('active');
    document.getElementById('finalContainer').classList.add('active');
    document.getElementById('finalCategory').textContent = 'Category: ' + FINAL.category;
    document.getElementById('finalQuestion').innerHTML = FINAL.q;
    document.getElementById('finalAnswerText').textContent = FINAL.a;
    document.getElementById('finalExplanation').textContent = FINAL.ex;
    document.getElementById('finalAnswerBox').classList.remove('visible');
    document.getElementById('finalRevealBtn').style.display = '';
}

function revealFinalAnswer() {
    document.getElementById('finalAnswerBox').classList.add('visible');
    document.getElementById('finalRevealBtn').style.display = 'none';
}

function backToBoard() {
    document.getElementById('finalContainer').classList.remove('active');
    document.getElementById('gameContainer').classList.add('active');
}

function resetGame() {
    if (!confirm('Reset the entire game? All scores and progress will be lost.')) return;
    currentRound = 1;
    usedCells = { 1: new Set(), 2: new Set() };
    pickDailyDoubles();
    document.getElementById('roundIndicator').textContent = 'Round 1 of 2';
    document.getElementById('nextRoundBtn').style.display = 'none';
    document.getElementById('finalBtn').style.display = 'none';
    initTeams();
    renderScoreboard();
    renderBoard(1);
}
</script>
</body>
</html>
