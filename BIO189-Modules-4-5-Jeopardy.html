<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIO 189 Modules 4 &amp; 5 Jeopardy!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 50%, #0d1f3c 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .splash-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, #1a2a4a 0%, #0a1628 70%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .splash-screen.hidden { opacity: 0; pointer-events: none; }

        .splash-logo {
            font-size: 5em;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.6), 3px 3px 6px rgba(0,0,0,0.8);
            letter-spacing: 8px;
            animation: pulseGlow 2s ease-in-out infinite;
            margin-bottom: 20px;
        }

        .splash-subtitle {
            font-size: 1.5em;
            color: #8ab4f8;
            margin-bottom: 10px;
        }

        .splash-course {
            font-size: 1.1em;
            color: #aaa;
            margin-bottom: 40px;
        }

        .splash-btn {
            padding: 18px 50px;
            font-size: 1.4em;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
        }

        .splash-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 30px rgba(255, 215, 0, 0.6);
        }

        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 30px rgba(255,215,0,0.6), 3px 3px 6px rgba(0,0,0,0.8); }
            50% { text-shadow: 0 0 50px rgba(255,215,0,0.9), 3px 3px 6px rgba(0,0,0,0.8); }
        }

        .game-container { display: none; padding: 15px; max-width: 1500px; margin: 0 auto; }
        .game-container.active { display: block; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .top-bar h1 {
            font-size: 2.2em;
            color: #ffd700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 4px;
        }

        .round-indicator {
            font-size: 1.1em;
            color: #8ab4f8;
            background: rgba(255,255,255,0.08);
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid rgba(138, 180, 248, 0.3);
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .ctrl-btn {
            padding: 8px 18px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            background: rgba(255,255,255,0.1);
            color: #ccc;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ctrl-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }

        .ctrl-btn.gold {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
            border: none;
            font-weight: bold;
        }

        .ctrl-btn.gold:hover { box-shadow: 0 0 15px rgba(255,215,0,0.5); }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .team {
            background: linear-gradient(135deg, rgba(50,70,120,0.8), rgba(30,50,90,0.8));
            padding: 12px 15px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid rgba(255,215,0,0.3);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .team.active {
            border-color: #00e676;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.3);
        }

        .team h3 { font-size: 1.1em; color: #ffd700; margin-bottom: 5px; }
        .team .score { font-size: 1.8em; font-weight: bold; }

        .team .score-controls {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
        }

        .score-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .score-btn:hover { background: rgba(255,255,255,0.25); }

        .board {
            background: rgba(0,0,0,0.6);
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            border: 2px solid rgba(255,215,0,0.15);
        }

        .category-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .category-header {
            background: linear-gradient(180deg, #0055aa, #003d7a);
            padding: 15px 8px;
            text-align: center;
            font-size: 0.85em;
            font-weight: bold;
            border-radius: 8px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.3;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .question-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }

        .cell {
            background: linear-gradient(180deg, #1a3a7a, #0d2555);
            padding: 18px 8px;
            text-align: center;
            font-size: 1.6em;
            font-weight: bold;
            color: #ffd700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s;
            border: 1px solid rgba(255,215,0,0.15);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .cell:hover:not(.used) {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,215,0,0.4);
            border-color: #ffd700;
        }

        .cell.used {
            background: rgba(20,30,50,0.6);
            color: rgba(255,255,255,0.1);
            cursor: default;
            border-color: transparent;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: linear-gradient(135deg, #0d2555, #1a3a7a);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 60px rgba(255,215,0,0.3);
            animation: modalIn 0.4s ease;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-category {
            font-size: 0.9em;
            color: #8ab4f8;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .modal-value {
            font-size: 2.5em;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255,215,0,0.5);
        }

        .modal-question {
            font-size: 1.4em;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #e8e8e8;
            padding: 0 10px;
        }

        .modal-question em { color: #8ab4f8; font-style: italic; }

        .modal-answer {
            background: rgba(0,230,118,0.1);
            border: 2px solid #00e676;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: none;
            animation: revealAnswer 0.5s ease;
        }

        .modal-answer.visible { display: block; }

        @keyframes revealAnswer {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-answer h4 {
            color: #00e676;
            font-size: 1em;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .modal-answer p {
            font-size: 1.3em;
            color: #fff;
            font-weight: bold;
        }

        .modal-answer .explanation {
            font-size: 0.85em;
            color: #aaa;
            margin-top: 10px;
            font-weight: normal;
            line-height: 1.5;
        }

        .modal-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

        .modal-btn {
            padding: 12px 30px;
            font-family: 'Courier New', monospace;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        .btn-reveal {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a2e;
        }

        .btn-reveal:hover { box-shadow: 0 0 20px rgba(255,215,0,0.5); }

        .btn-correct {
            background: linear-gradient(135deg, #00e676, #00c853);
            color: #1a1a2e;
        }

        .btn-wrong {
            background: linear-gradient(135deg, #ff5252, #d32f2f);
            color: #fff;
        }

        .btn-close {
            background: rgba(255,255,255,0.15);
            color: #ccc;
        }

        .btn-close:hover { background: rgba(255,255,255,0.25); }

        .daily-double-flash {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse, #ffd700, #ff8800);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            animation: ddFlash 1.5s ease-in-out forwards;
        }

        .daily-double-flash.active { display: flex; }

        .daily-double-flash h1 {
            font-size: 5em;
            color: #1a1a2e;
            text-shadow: 3px 3px 0 rgba(255,255,255,0.3);
            letter-spacing: 8px;
        }

        @keyframes ddFlash {
            0% { transform: scale(0.5); opacity: 0; }
            30% { transform: scale(1.1); opacity: 1; }
            70% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .final-container {
            display: none;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .final-container.active { display: block; }

        .final-container h1 {
            font-size: 3em;
            color: #ffd700;
            margin-bottom: 10px;
            letter-spacing: 5px;
        }

        .final-category {
            font-size: 1.5em;
            color: #8ab4f8;
            margin-bottom: 30px;
        }

        .final-question {
            font-size: 1.4em;
            line-height: 1.7;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            border: 2px solid rgba(255,215,0,0.2);
        }

        .final-answer-box {
            background: rgba(0,230,118,0.1);
            border: 2px solid #00e676;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            display: none;
        }

        .final-answer-box.visible { display: block; }

        .final-answer-box h4 { color: #00e676; margin-bottom: 8px; letter-spacing: 2px; }
        .final-answer-box p { font-size: 1.4em; font-weight: bold; }
        .final-answer-box .explanation { font-size: 0.9em; color: #aaa; margin-top: 10px; line-height: 1.5; }

        .footer {
            text-align: center;
            padding: 30px;
            color: #555;
            font-size: 0.85em;
        }

        .footer a { color: #8ab4f8; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .splash-logo { font-size: 3em; }
            .top-bar h1 { font-size: 1.4em; }
            .category-header { font-size: 0.65em; min-height: 55px; padding: 8px 4px; }
            .cell { font-size: 1em; padding: 12px 4px; }
            .modal { padding: 25px; }
            .modal-question { font-size: 1.1em; }
            .modal-value { font-size: 1.8em; }
        }
    </style>
</head>
<body>

<div class="splash-screen" id="splash">
    <div class="splash-logo">JEOPARDY!</div>
    <div class="splash-subtitle">BIO 189 &middot; Modules 4 &amp; 5</div>
    <div class="splash-course">Fundamentals of Biology &middot; DNA, Chromosomes &amp; Gene Expression</div>
    <button class="splash-btn" onclick="startGame()">START GAME</button>
</div>

<div class="game-container" id="gameContainer">
    <div class="top-bar">
        <h1>JEOPARDY!</h1>
        <div class="round-indicator" id="roundIndicator">Round 1 of 2</div>
        <div class="controls">
            <button class="ctrl-btn" onclick="resetGame()">Reset</button>
            <button class="ctrl-btn gold" id="nextRoundBtn" onclick="nextRound()" style="display:none;">Round 2 &raquo;</button>
            <button class="ctrl-btn gold" id="finalBtn" onclick="startFinalJeopardy()" style="display:none;">Final Jeopardy!</button>
        </div>
    </div>

    <div class="scoreboard" id="scoreboard"></div>
    <div class="board" id="board"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-category" id="modalCategory"></div>
        <div class="modal-value" id="modalValue"></div>
        <div class="modal-question" id="modalQuestion"></div>
        <div class="modal-answer" id="modalAnswer">
            <h4>ANSWER</h4>
            <p id="modalAnswerText"></p>
            <div class="explanation" id="modalExplanation"></div>
        </div>
        <div class="modal-buttons" id="modalButtons">
            <button class="modal-btn btn-reveal" id="revealBtn" onclick="revealAnswer()">Show Answer</button>
            <button class="modal-btn btn-correct" id="correctBtn" style="display:none;" onclick="markCorrect()">Correct &#10003;</button>
            <button class="modal-btn btn-wrong" id="wrongBtn" style="display:none;" onclick="markWrong()">Wrong &#10007;</button>
            <button class="modal-btn btn-close" onclick="closeModal()">Close</button>
        </div>
    </div>
</div>

<div class="daily-double-flash" id="ddFlash">
    <h1>DAILY DOUBLE!</h1>
</div>

<div class="final-container" id="finalContainer">
    <h1>FINAL JEOPARDY!</h1>
    <div class="final-category" id="finalCategory"></div>
    <div class="final-question" id="finalQuestion"></div>
    <div class="final-answer-box" id="finalAnswerBox">
        <h4>ANSWER</h4>
        <p id="finalAnswerText"></p>
        <div class="explanation" id="finalExplanation"></div>
    </div>
    <div class="modal-buttons">
        <button class="modal-btn btn-reveal" id="finalRevealBtn" onclick="revealFinalAnswer()">Show Answer</button>
        <button class="modal-btn btn-close" onclick="backToBoard()">Back to Board</button>
    </div>
</div>

<div class="footer" id="footerArea">
    &copy; BIO 189 Fundamentals of Biology &middot; <a href="https://tehranilabs.org">TehraniLabs.org</a>
</div>

<script>
const ROUND1 = {
    "categories": [
        "DNA Hall of Fame",
        "Nucleotide Nuts & Bolts",
        "Pair Up!",
        "DNA vs. RNA",
        "Spools & Chromatids"
    ],
    "questions": [
        [
            {
                "q": "This duo built the 3D model of DNA as a twisted ladder, the double helix.",
                "a": "Watson and Crick",
                "ex": "Watson & Crick built the Winding staircase."
            },
            {
                "q": "Rosalind Franklin captured an image of DNA using this technique.",
                "a": "X-ray crystallography",
                "ex": "Franklin took the Foto (X-ray)."
            },
            {
                "q": "Hershey and Chase used these bacteria-infecting viruses to deliver the genetic material.",
                "a": "Bacteriophages",
                "ex": "Phage = a virus that infects bacteria. It injects its genetic material into the bacterium."
            },
            {
                "q": "Hershey and Chase showed the material injected into bacteria was DNA, NOT this other macromolecule.",
                "a": "Protein",
                "ex": "The syrup (DNA) went into the donut; the protein coat stayed outside."
            },
            {
                "q": "A student credits Watson and Crick with proving DNA is the genetic material. Name the pair who actually did that experiment.",
                "a": "Hershey and Chase",
                "ex": "Watson & Crick modeled the STRUCTURE. Hershey & Chase proved DNA is what gets injected."
            }
        ],
        [
            {
                "q": "DNA is a polymer; this is the name of its monomer.",
                "a": "A nucleotide",
                "ex": "Many nucleotides linked in a row make one DNA strand."
            },
            {
                "q": "The part of a nucleotide that is a 5-carbon sugar.",
                "a": "The pentose sugar",
                "ex": "Penta = five. Five carbons in the ring sugar."
            },
            {
                "q": "The number of components in every nucleotide.",
                "a": "Three",
                "ex": "Phosphate group, pentose sugar, nitrogenous base."
            },
            {
                "q": "Swap only this one part and you have a different nucleotide; the other two parts never change.",
                "a": "The nitrogenous base",
                "ex": "Phosphate and sugar are the same in every DNA nucleotide. The base (A, T, G or C) is the only variable."
            },
            {
                "q": "A human and an oak tree build DNA from the same four bases. Their differences come from this.",
                "a": "The sequence (order) of the nucleotides",
                "ex": "Same four letters, different words. The order carries the information."
            }
        ],
        [
            {
                "q": "In DNA, adenine always pairs with this base.",
                "a": "Thymine",
                "ex": "Apples in the Tree: A with T."
            },
            {
                "q": "Cars in the Garage: guanine pairs with this base.",
                "a": "Cytosine",
                "ex": "G with C, every time."
            },
            {
                "q": "These bonds zip the two strands together across the middle of the helix.",
                "a": "Hydrogen bonds",
                "ex": "They connect complementary bases on opposite strands."
            },
            {
                "q": "A DNA sample is 30% guanine. This is its percentage of adenine.",
                "a": "20%",
                "ex": "G = C = 30%, so G + C = 60%. That leaves 40% for A + T, split evenly: A = 20%."
            },
            {
                "q": "A DNA sample is 18% thymine. This is the COMBINED percentage of guanine plus cytosine.",
                "a": "64%",
                "ex": "T = A = 18%, so A + T = 36%. Everything else is G + C: 100% - 36% = 64%."
            }
        ],
        [
            {
                "q": "This base takes thymine's place in RNA.",
                "a": "Uracil (U)",
                "ex": "U stands where T stood."
            },
            {
                "q": "Most RNA has this shape, unlike DNA's double helix.",
                "a": "Single-stranded",
                "ex": "DNA: two strands. Most RNA: one strand."
            },
            {
                "q": "Spot a U anywhere in a sequence and you are reading this nucleic acid.",
                "a": "RNA",
                "ex": "Uracil is found in RNA, never in DNA."
            },
            {
                "q": "Of A, T, G, C and U, these two bases are NOT shared by DNA and RNA.",
                "a": "Thymine (DNA only) and uracil (RNA only)",
                "ex": "A, G and C appear in both. T is DNA's; U is RNA's."
            },
            {
                "q": "A strand reads 5' AUGGCU 3'. Name the nucleic acid AND the one letter that proves it.",
                "a": "RNA; the U (uracil)",
                "ex": "No T anywhere and a U present: it has to be RNA."
            }
        ],
        [
            {
                "q": "The total number of chromosomes in most human body cells.",
                "a": "46",
                "ex": "23 pairs."
            },
            {
                "q": "Eukaryotic DNA wraps around these protein spools.",
                "a": "Histones",
                "ex": "Thread on spools: DNA is the thread, histones are the spools."
            },
            {
                "q": "The pinched 'waist' that holds two sister chromatids together.",
                "a": "The centromere",
                "ex": "Centro = center. It sits at the waist of the X shape."
            },
            {
                "q": "Two identical copies of one replicated chromosome.",
                "a": "Sister chromatids",
                "ex": "Sisters are identical; they are joined at the centromere."
            },
            {
                "q": "A person's diploid cells have 46 chromosomes. Their haploid cells have this many.",
                "a": "23",
                "ex": "Diploid = 2 sets = 2 x haploid. 46 / 2 = 23."
            }
        ]
    ]
};

const ROUND2 = {
    "categories": [
        "Karyotype Detective",
        "Copy Machine",
        "Transcription Station",
        "Splice & Translate",
        "Typo Clinic"
    ],
    "questions": [
        [
            {
                "q": "An organized picture of an individual's complete set of chromosomes.",
                "a": "A karyotype",
                "ex": "Chromosomes are lined up in numbered pairs so you can count and compare them."
            },
            {
                "q": "Matching chromosome pairs, one from each parent, with the same length, shape and genes.",
                "a": "Homologous chromosomes",
                "ex": "Homo = same. One from mom, one from dad."
            },
            {
                "q": "Chromosome pairs that are the same in males and females: the non-sex chromosomes.",
                "a": "Autosomes",
                "ex": "Pairs 1 to 22 are autosomes."
            },
            {
                "q": "On a karyotype, check this pair to identify biological sex.",
                "a": "Pair #23 (XX = female, XY = male)",
                "ex": "The sex chromosomes sit at pair 23."
            },
            {
                "q": "A karyotype shows THREE copies of chromosome 21. Give the total chromosome count AND the condition.",
                "a": "47; Down syndrome",
                "ex": "46 + 1 extra copy = 47. Trisomy 21 is Down syndrome."
            }
        ],
        [
            {
                "q": "DNA is replicated during this phase of the cell cycle.",
                "a": "S phase (synthesis)",
                "ex": "S for Synthesis: the DNA is copied before the cell divides."
            },
            {
                "q": "The replication model where each new helix keeps one old strand and gets one new strand.",
                "a": "Semiconservative",
                "ex": "Semi = half. Half of each new helix is conserved (old)."
            },
            {
                "q": "The very first step of replication, before anything is built.",
                "a": "Enzymes unwind and separate the two strands",
                "ex": "You cannot read a template while it is zipped up."
            },
            {
                "q": "This short, single strand base-pairs with the template and gives DNA polymerase a place to attach.",
                "a": "A primer",
                "ex": "No primer, no polymerase. The primer lands first."
            },
            {
                "q": "Put in order: (A) DNA polymerase adds complementary nucleotides, (B) the strands unwind and separate, (C) primers base-pair with the single strands.",
                "a": "B, then C, then A",
                "ex": "Unwind, then prime, then build. The famous builder (polymerase) is LAST."
            }
        ],
        [
            {
                "q": "The process that copies a gene's DNA information into mRNA.",
                "a": "Transcription",
                "ex": "Transcribe = write across, from DNA language into RNA language."
            },
            {
                "q": "This enzyme builds the mRNA strand in eukaryotes.",
                "a": "RNA polymerase",
                "ex": "Making RNA? RNA polymerase. Copying DNA? DNA polymerase."
            },
            {
                "q": "During transcription, each A on the DNA template pairs with this base in the mRNA.",
                "a": "U (uracil)",
                "ex": "RNA has no T, so A pairs with U."
            },
            {
                "q": "Transcribe this DNA template strand: 3' GCA TTA 5'.",
                "a": "5' CGU AAU 3'",
                "ex": "G to C, C to G, A to U, T to A. Flip the ends: 3' to 5' becomes 5' to 3'."
            },
            {
                "q": "Transcribe this DNA template strand: 3' ATG CCT AGA 5'.",
                "a": "5' UAC GGA UCU 3'",
                "ex": "A to U, T to A, G to C, C to G. Check: there should be no T anywhere in the answer."
            }
        ],
        [
            {
                "q": "The coding sections that stay in the mature mRNA.",
                "a": "Exons",
                "ex": "EXons are EXpressed."
            },
            {
                "q": "The non-coding sections cut out before translation.",
                "a": "Introns",
                "ex": "INtrons are INtervening; they get spliced out and stay in the nucleus."
            },
            {
                "q": "A sequence of three nucleotides on mRNA that specifies one amino acid.",
                "a": "A codon",
                "ex": "mRNA is read three bases at a time."
            },
            {
                "q": "This RNA carries one amino acid to the ribosome and checks its anticodon against the codon.",
                "a": "tRNA (transfer RNA)",
                "ex": "The delivery truck of translation."
            },
            {
                "q": "In the hospital analogy, mRNA is the sticky note sent out to 'the floor.' Name the real cell structure that is the floor.",
                "a": "The ribosome",
                "ex": "The ribosome is where the mRNA is read and the protein is built."
            }
        ],
        [
            {
                "q": "A permanent change in the DNA sequence of a chromosome.",
                "a": "A mutation",
                "ex": "Permanent means permanent: it stays unless repaired, and it can be passed on."
            },
            {
                "q": "Mutation type in which one or more nucleotides are ADDED to the DNA.",
                "a": "Insertion",
                "ex": "An extra base gets pushed into the sequence."
            },
            {
                "q": "UV light creates these, which put a physical kink in the double helix.",
                "a": "Nucleotide dimers (thymine dimers)",
                "ex": "Two neighboring bases on the same strand get stuck together."
            },
            {
                "q": "Cystic fibrosis is caused by this type of mutation.",
                "a": "Deletion",
                "ex": "Nucleotides are removed from the DNA."
            },
            {
                "q": "In sickle cell anemia, GAG becomes GUG in the mRNA. Name the mutation type AND explain why its location in an exon matters.",
                "a": "Base-pair substitution; exons code for the protein, so the amino acid sequence changes",
                "ex": "One base swapped for another. Because exons stay in the mature mRNA, the change reaches the protein."
            }
        ]
    ]
};

const FINAL = {
    "category": "Sunburn to Daughter Cell",
    "q": "A skin cell is exposed to strong sunlight and its DNA develops a kink inside an EXON. Name: (1) the kinked structure UV light creates, (2) why damage in an exon is more likely to change the protein than damage in an intron, AND (3) the cell-cycle phase in which this damaged DNA would be copied.",
    "a": "(1) Nucleotide (thymine) dimers; (2) exons stay in the mature mRNA and code for the amino acid sequence, while introns are spliced out; (3) S phase",
    "ex": "UV makes dimers that kink the helix. Exons are expressed, so a change there can reach the protein. If the damage is not repaired before S phase, it can be copied and passed on as a permanent mutation."
};

let teams = [];
let currentRound = 1;
let currentValue = 0;
let usedCells = { 1: new Set(), 2: new Set() };
let dailyDoubles = { 1: null, 2: null };

function initTeams() {
    teams = [
        { name: "Team 1", score: 0 },
        { name: "Team 2", score: 0 },
        { name: "Team 3", score: 0 },
        { name: "Team 4", score: 0 }
    ];
}

function renderScoreboard() {
    const sb = document.getElementById('scoreboard');
    sb.innerHTML = teams.map((t, i) => `
        <div class="team ${i === 0 ? 'active' : ''}" onclick="selectTeam(${i})" id="team${i}">
            <h3 contenteditable="true" onblur="renameTeam(${i}, this.textContent)">${t.name}</h3>
            <div class="score" id="score${i}">$${t.score}</div>
            <div class="score-controls">
                <button class="score-btn" onclick="event.stopPropagation(); adjustScore(${i}, -100)">-</button>
                <button class="score-btn" onclick="event.stopPropagation(); adjustScore(${i}, 100)">+</button>
            </div>
        </div>
    `).join('');
}

function selectTeam(idx) {
    document.querySelectorAll('.team').forEach(t => t.classList.remove('active'));
    document.getElementById('team' + idx).classList.add('active');
}

function renameTeam(idx, name) {
    teams[idx].name = name.trim() || `Team ${idx + 1}`;
}

function adjustScore(idx, amount) {
    teams[idx].score += amount;
    document.getElementById('score' + idx).textContent = '$' + teams[idx].score;
}

function getActiveTeam() {
    const active = document.querySelector('.team.active');
    if (!active) return 0;
    return parseInt(active.id.replace('team', ''));
}

function pickDailyDoubles() {
    dailyDoubles[1] = Math.floor(Math.random() * 25);
    dailyDoubles[2] = Math.floor(Math.random() * 25);
}

function renderBoard(roundNum) {
    const data = roundNum === 1 ? ROUND1 : ROUND2;
    const values = [200, 400, 600, 800, 1000];
    const board = document.getElementById('board');

    let html = '<div class="category-row">';
    data.categories.forEach(cat => {
        html += `<div class="category-header">${cat}</div>`;
    });
    html += '</div>';

    for (let row = 0; row < 5; row++) {
        html += '<div class="question-row">';
        for (let col = 0; col < 5; col++) {
            const flatIdx = row * 5 + col;
            const used = usedCells[roundNum].has(flatIdx);
            html += `<div class="cell ${used ? 'used' : ''}" onclick="openQuestion(${roundNum}, ${col}, ${row}, ${values[row]}, ${flatIdx})">$${values[row]}</div>`;
        }
        html += '</div>';
    }

    board.innerHTML = html;
}

function startGame() {
    document.getElementById('splash').classList.add('hidden');
    document.getElementById('gameContainer').classList.add('active');
    initTeams();
    pickDailyDoubles();
    renderScoreboard();
    renderBoard(1);
}

function openQuestion(roundNum, catIdx, qIdx, value, flatIdx) {
    if (usedCells[roundNum].has(flatIdx)) return;
    usedCells[roundNum].add(flatIdx);
    currentValue = value;
    renderBoard(roundNum);

    const data = roundNum === 1 ? ROUND1 : ROUND2;
    const qData = data.questions[catIdx][qIdx];

    if (flatIdx === dailyDoubles[roundNum]) {
        showDailyDouble(data.categories[catIdx], value, qData);
    } else {
        showQuestionModal(data.categories[catIdx], value, qData, false);
    }
}

function showDailyDouble(category, value, qData) {
    const dd = document.getElementById('ddFlash');
    dd.classList.add('active');
    setTimeout(() => {
        dd.classList.remove('active');
        showQuestionModal(category, value, qData, true);
    }, 2000);
}

function showQuestionModal(category, value, qData, isDD) {
    document.getElementById('modalCategory').textContent = category;
    document.getElementById('modalValue').textContent = isDD ? 'DAILY DOUBLE!' : '$' + value;
    document.getElementById('modalQuestion').innerHTML = qData.q;
    document.getElementById('modalAnswerText').textContent = qData.a;
    document.getElementById('modalExplanation').textContent = qData.ex;
    document.getElementById('modalAnswer').classList.remove('visible');
    document.getElementById('revealBtn').style.display = '';
    document.getElementById('correctBtn').style.display = 'none';
    document.getElementById('wrongBtn').style.display = 'none';
    document.getElementById('modalOverlay').classList.add('active');
}

function revealAnswer() {
    document.getElementById('modalAnswer').classList.add('visible');
    document.getElementById('revealBtn').style.display = 'none';
    document.getElementById('correctBtn').style.display = '';
    document.getElementById('wrongBtn').style.display = '';
}

function markCorrect() {
    const idx = getActiveTeam();
    teams[idx].score += currentValue;
    document.getElementById('score' + idx).textContent = '$' + teams[idx].score;
    closeModal();
}

function markWrong() {
    const idx = getActiveTeam();
    teams[idx].score -= currentValue;
    document.getElementById('score' + idx).textContent = '$' + teams[idx].score;
    closeModal();
}

function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    checkRoundComplete();
}

function checkRoundComplete() {
    if (currentRound === 1 && usedCells[1].size === 25) {
        document.getElementById('nextRoundBtn').style.display = '';
    }
    if (currentRound === 2 && usedCells[2].size === 25) {
        document.getElementById('finalBtn').style.display = '';
    }
}

function nextRound() {
    currentRound = 2;
    document.getElementById('roundIndicator').textContent = 'Round 2 of 2';
    document.getElementById('nextRoundBtn').style.display = 'none';
    renderBoard(2);
}

function startFinalJeopardy() {
    document.getElementById('gameContainer').classList.remove('active');
    document.getElementById('finalContainer').classList.add('active');
    document.getElementById('finalCategory').textContent = 'Category: ' + FINAL.category;
    document.getElementById('finalQuestion').innerHTML = FINAL.q;
    document.getElementById('finalAnswerText').textContent = FINAL.a;
    document.getElementById('finalExplanation').textContent = FINAL.ex;
    document.getElementById('finalAnswerBox').classList.remove('visible');
    document.getElementById('finalRevealBtn').style.display = '';
}

function revealFinalAnswer() {
    document.getElementById('finalAnswerBox').classList.add('visible');
    document.getElementById('finalRevealBtn').style.display = 'none';
}

function backToBoard() {
    document.getElementById('finalContainer').classList.remove('active');
    document.getElementById('gameContainer').classList.add('active');
}

function resetGame() {
    if (!confirm('Reset the entire game? All scores and progress will be lost.')) return;
    currentRound = 1;
    usedCells = { 1: new Set(), 2: new Set() };
    pickDailyDoubles();
    document.getElementById('roundIndicator').textContent = 'Round 1 of 2';
    document.getElementById('nextRoundBtn').style.display = 'none';
    document.getElementById('finalBtn').style.display = 'none';
    initTeams();
    renderScoreboard();
    renderBoard(1);
}
</script>
</body>
</html>
