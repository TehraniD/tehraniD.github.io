<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patho Modules 4 &amp; 5 — Class Review</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- Base Styles --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; padding: 30px; color: #333; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }

        h1 { text-align: center; color: #2c3e50; margin-bottom: 6px; font-size: 1.8em; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 20px; font-size: 0.95em; }

        /* --- Score Board Style --- */
        .score-board {
            display: flex; justify-content: space-around; background: white;
            padding: 15px; margin-bottom: 25px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e1e4e8;
        }
        .score-item { text-align: center; }
        .score-val { font-size: 1.5em; font-weight: bold; display: block; }
        .score-lbl { font-size: 0.85em; color: #7f8c8d; text-transform: uppercase; font-weight: 600; }

        .c-purple { color: #8e44ad; }
        .c-green { color: #27ae60; }
        .c-red { color: #e74c3c; }
        .c-grey { color: #7f8c8d; }

        .btn-reset-container { text-align: center; margin-bottom: 30px; }
        .btn-reset {
            background-color: #34495e; color: white; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
            transition: 0.2s;
        }
        .btn-reset:hover { background-color: #2c3e50; }

        /* --- Question Card --- */
        .question-card {
            background: white; padding: 25px; margin-bottom: 25px;
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid #e1e4e8;
        }

        .q-header { font-weight: 700; color: #7f8c8d; margin-bottom: 15px; font-size: 0.9em; text-transform: uppercase; }
        .q-body { font-size: 1.2em; margin-bottom: 20px; color: #2c3e50; font-weight: 500; }

        /* Images */
        .question-card img, .feedback-text img, .overall-explanation img {
            max-width: 100% !important; height: auto !important; display: block;
            margin: 15px auto; border-radius: 6px; cursor: zoom-in;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .q-answers { list-style: none; padding: 0; }

        /* --- Option Styles --- */
        .option {
            padding: 15px 20px; border: 2px solid #e1e4e8; margin-bottom: 12px; border-radius: 8px;
            cursor: pointer; transition: all 0.2s ease; background: white;
            display: flex; flex-direction: column;
        }

        .option-content { display: flex; align-items: flex-start; gap: 15px; width: 100%; }

        .option:hover:not(.answered) { border-color: #bdc3c7; background-color: #f8f9fa; }
        .option.selected:not(.answered) { border-color: #34495e; background-color: #edf2f7; }

        /* Icons */
        .chk {
            font-size: 1.1em; flex-shrink: 0; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #bdc3c7; background: white; margin-top: 2px;
        }
        .chk.radio { border-radius: 50%; }
        .chk.checkbox { border-radius: 4px; }

        .option.selected .chk { border-color: #2c3e50; background: #2c3e50; }
        .option.selected .chk::after { content: ''; display: block; width: 10px; height: 10px; background: white; border-radius: 50%; }

        /* --- Feedback Section --- */
        .feedback-text {
            margin-top: 15px; padding: 12px 15px; font-size: 0.95em;
            border-left: 4px solid; background-color: rgba(255,255,255,0.5);
            border-radius: 0 4px 4px 0; animation: fadeIn 0.3s ease;
            display: none;
        }
        .feedback-text:empty { display: none !important; }

        /* --- Overall Explanation Button & Section --- */
        .explanation-wrapper {
            margin-top: 20px;
            display: none;
        }

        .btn-explain {
            background-color: #f39c12; color: white; border: none;
            padding: 10px 20px; border-radius: 6px; cursor: pointer;
            font-size: 14px; font-weight: 600; display: inline-flex;
            align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-explain:hover { background-color: #d68910; }

        .overall-explanation {
            display: none;
            margin-top: 15px; padding: 20px;
            background-color: #fff8e1; border: 1px solid #ffe0b2;
            border-radius: 8px; color: #333; animation: fadeIn 0.5s ease;
            overflow-wrap: break-word;
        }
        .overall-explanation h4 {
            margin: 0 0 10px 0; color: #e67e22; font-size: 1em;
            text-transform: uppercase; font-weight: 700;
        }

        /* --- States After Submit --- */
        .option.user-wrong { border-color: #e74c3c; background-color: #fdecea; cursor: default; }
        .option.user-wrong .chk { border-color: #e74c3c; background: #e74c3c; }
        .option.user-wrong .chk::after { content: '✕'; color: white; background: none; font-size: 16px; font-weight: bold; width: auto; height: auto; }
        .option.user-wrong .feedback-text { display: block; border-color: #c0392b; color: #c0392b; background-color: rgba(231, 76, 60, 0.1); }

        .option.show-correct { border-color: #27ae60; background-color: #e8f8f5; cursor: default; }
        .option.show-correct .chk { border-color: #27ae60; background: #27ae60; }
        .option.show-correct .chk::after { content: '✓'; color: white; background: none; font-size: 16px; font-weight: bold; width: auto; height: auto; }
        .option.show-correct .feedback-text { display: block; border-color: #27ae60; color: #1e8449; background-color: rgba(39, 174, 96, 0.1); font-weight: 500; }

        .btn-submit-container { margin-top: 20px; }
        .btn-submit { background-color: #2980b9; color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; }
        .btn-submit:hover { background-color: #2471a3; }
        .btn-submit:disabled { opacity: 0.7; cursor: default; }

        /* Module tag */
        .module-tag { display: inline-block; font-size: 0.75em; font-weight: 700; padding: 3px 10px; border-radius: 12px; margin-left: 8px; vertical-align: middle; }
        .mt-m4 { background: #eaf2fb; color: #2980b9; border: 1px solid #bdd7f0; }
        .mt-m5 { background: #fdeeee; color: #c0392b; border: 1px solid #f2c6c0; }

        /* Modal Zoom */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 90vh; }
        .close { position: absolute; top: 15px; right: 35px; color: #fff; font-size: 40px; cursor: pointer; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Patho Modules 4 &amp; 5 — Class Review</h1>
        <div class="subtitle">Musculoskeletal &amp; Digestive Disorders &middot; 25 Questions</div>

        <div class="score-board">
            <div class="score-item">
                <span class="score-val c-purple" id="val-score">0%</span>
                <span class="score-lbl">Score</span>
            </div>
            <div class="score-item">
                <span class="score-val c-green" id="val-correct">0</span>
                <span class="score-lbl">Correct</span>
            </div>
            <div class="score-item">
                <span class="score-val c-red" id="val-wrong">0</span>
                <span class="score-lbl">Wrong</span>
            </div>
            <div class="score-item">
                <span class="score-val c-grey" id="val-remain">0</span>
                <span class="score-lbl">Remaining</span>
            </div>
        </div>

        <div class="btn-reset-container">
            <button class="btn-reset" onclick="resetQuiz()">Reset Quiz</button>
        </div>
        <div id="questions-container"></div>
    </div>

    <div id="imageModal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="img01">
    </div>

    <script>
        const quizData = {"quiz_title":"Patho Modules 4 & 5 — Class Review","questions":[
        {"_class":"assessment","id":24001,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A nurse is creating a study sheet for the unit. A term that describes the study of inflammatory muscle, bone, and joint disease is:</p>","explanation":"<p>Rheumatology is the branch of medicine that deals with the study and treatment of inflammatory conditions affecting the musculoskeletal system. Memory hook: <strong>“Rheuma = River”</strong> — rheumatology maps the rivers of inflammation flooding muscles, bones, and joints. Dermatology = skin, Ophthalmology = eyes, Oncology = cancer.</p>","answers":["<p>Rheumatology</p>","<p>Dermatology</p>","<p>Ophthalmology</p>","<p>Oncology</p>"],"feedbacks":["<p>Correct — rheumatology is the study of inflammatory muscle, bone, and joint disease. The dermatology (skin), ophthalmology (eyes), and oncology (cancer) options are pure prefix traps.</p>","","",""]},"correct_response":["a"]},
        {"_class":"assessment","id":24002,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A 62-year-old postmenopausal woman has a bone density screening that shows early thinning of the trabecular matrix — below normal, but not at the severity of osteoporosis. The nurse recognizes this finding as:</p>","explanation":"<p>Osteopenia is the thinning of the trabecular matrix that occurs BEFORE osteoporosis. It is most common in older adults, especially postmenopausal women, and it is a <strong>clinical warning sign — not a diagnosis requiring immediate drug treatment</strong>. Management = prevention: calcium, vitamin D, weight-bearing exercise. Memory hook: <strong>osteopenia is the yellow traffic light</strong> before osteoporosis's red light. You don't call a tow truck at yellow — you just drive smarter.</p>","answers":["<p>Osteoporosis</p>","<p>Osteopenia</p>","<p>Osteomyelitis</p>","<p>Osteoarthritis</p>"],"feedbacks":["","<p>Osteopenia is the precursor state — a warning sign, not a diagnosis needing immediate treatment. Bone loss is present but below osteoporosis severity, so the plan is prevention (calcium, vitamin D, weight-bearing exercise), which is exactly what this client is most at risk for as a postmenopausal woman.</p>","",""]},"correct_response":["b"]},
        {"_class":"assessment","id":24003,"assessment_type":"multi-select","module":"M4","prompt":{"question":"<p>The nurse is reviewing risk factors for osteoporosis with a group of clients. Which factors increase the risk of osteoporosis? <strong>Select all that apply.</strong></p>","explanation":"<p>The four big risk-factor buckets: <strong>Age</strong> (bone density gradually declines), <strong>Gender</strong> (women — especially postmenopausal — because of decreased estrogen), <strong>Lifestyle</strong> (poor diet low in calcium/vit D, inactivity, smoking, excessive alcohol), and <strong>Medications</strong> (long-term corticosteroids). Adequate calcium and weight-bearing exercise are <em>protective</em>, not risks. Memory hook: bone is a bank and <strong>estrogen is the security guard — menopause fires the guard</strong> and the heist begins.</p>","answers":["<p>Postmenopausal estrogen decline</p>","<p>Long-term corticosteroid use</p>","<p>Adequate dietary calcium and vitamin D</p>","<p>Smoking and excessive alcohol use</p>","<p>Regular weight-bearing exercise</p>"],"feedbacks":["<p>Risk factors are age, gender (postmenopausal estrogen loss), lifestyle (low calcium/vit D diet, inactivity, smoking, excessive alcohol), and long-term corticosteroid use. Adequate calcium/vit D (C) and weight-bearing exercise (E) are protective management strategies — classic reversal traps.</p>","<p>Risk factors are age, gender (postmenopausal estrogen loss), lifestyle (low calcium/vit D diet, inactivity, smoking, excessive alcohol), and long-term corticosteroid use. Adequate calcium/vit D (C) and weight-bearing exercise (E) are protective management strategies — classic reversal traps.</p>","<p>Risk factors are age, gender (postmenopausal estrogen loss), lifestyle (low calcium/vit D diet, inactivity, smoking, excessive alcohol), and long-term corticosteroid use. Adequate calcium/vit D (C) and weight-bearing exercise (E) are protective management strategies — classic reversal traps.</p>","<p>Risk factors are age, gender (postmenopausal estrogen loss), lifestyle (low calcium/vit D diet, inactivity, smoking, excessive alcohol), and long-term corticosteroid use. Adequate calcium/vit D (C) and weight-bearing exercise (E) are protective management strategies — classic reversal traps.</p>","<p>Risk factors are age, gender (postmenopausal estrogen loss), lifestyle (low calcium/vit D diet, inactivity, smoking, excessive alcohol), and long-term corticosteroid use. Adequate calcium/vit D (C) and weight-bearing exercise (E) are protective management strategies — classic reversal traps.</p>"]},"correct_response":["a","b","d"]},
        {"_class":"assessment","id":24004,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>The nurse observes that an older adult patient has <strong>kyphosis</strong> (hunched back). Which disorder should the nurse suspect?</p>","explanation":"<p>Kyphosis is an exaggerated outward curvature of the spine, and the bone disease that most commonly leads to it is <strong>osteoporosis</strong> — vertebral compression fractures let the spine collapse forward. Memory hook: the hunched back is the spine's quiet confession that the vault got robbed.</p>","answers":["<p>Osteoporosis</p>","<p>Osteomyelitis</p>","<p>Osteoarthritis</p>","<p>Spinal stenosis</p>"],"feedbacks":["<p>CORRECT — osteoporosis. Kyphosis is most commonly the visible result of osteoporotic vertebral compression. Osteomyelitis (B) is a bone infection; osteoarthritis (C) attacks joint cartilage, not vertebral shape; spinal stenosis (D) is canal narrowing.</p>","","",""]},"correct_response":["a"]},
        {"_class":"assessment","id":24005,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A nurse is teaching a client newly diagnosed with osteoporosis about self-management. Which client statement indicates correct understanding?</p>","explanation":"<p>Osteoporosis management = calcium and vitamin D supplementation, <strong>weight-bearing exercise</strong>, bisphosphonates, and possible hormone replacement therapy. Here's the scope trap the exam loves: <strong>weight-bearing exercise builds BONE (osteoporosis) but punishes worn JOINTS (osteoarthritis)</strong>, where low-impact non-weight-bearing is the rule. Swimming is wonderful — just not for building bone.</p>","answers":["<p>“I should avoid all exercise to protect my bones from fractures.”</p>","<p>“I'll take my calcium and vitamin D and do weight-bearing exercises like walking.”</p>","<p>“Swimming laps daily is the best exercise to rebuild my bone density.”</p>","<p>“If my bones are thin, exercise will only make fractures more likely.”</p>"],"feedbacks":["","<p>Correct — management includes calcium/vit D supplementation and weight-bearing exercises (plus bisphosphonates/HRT as prescribed). The distractors are traps: avoiding exercise worsens bone loss, and swimming is non-weight-bearing (great for OA, not for building bone).</p>","",""]},"correct_response":["b"]},
        {"_class":"assessment","id":24006,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A patient with a bone infection develops an abscess as infectious material enters the Haversian system, and pus begins forming as the body fights the infection. The nurse identifies this as which stage of bone infection?</p>","explanation":"<p>The four stages in order: <strong>(1) Inflammation</strong> — infection begins, swelling and pressure within bone; <strong>(2) Suppuration</strong> — pus forms, infectious material enters the Haversian system, abscess forms; <strong>(3) Sequestrum</strong> — bone necrosis (dead bone); <strong>(4) Involucrum</strong> — new bone forms around the dead bone (sequestrum). Memory hook: <strong>“I Saw Skeletons Inside”</strong> — the bone catches fire, pus storms the Haversian hallways, a piece of bone becomes the skeleton in the closet, and the body brick-walls the crime scene. Suppuration (pus/Haversian/abscess) is the headline stage the exam tests.</p>","answers":["<p>Inflammation</p>","<p>Suppuration</p>","<p>Sequestrum</p>","<p>Involucrum</p>"],"feedbacks":["","<p>CORRECT — Suppuration (stage 2): pus formation, infectious material entering the Haversian system, and abscess formation are the key indicators. Inflammation (stage 1) is swelling/pressure only; sequestrum is dead bone; involucrum is new bone around the dead bone.</p>","",""]},"correct_response":["b"]},
        {"_class":"assessment","id":24007,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>During assessment of a client with osteoarthritis, the nurse notes bony enlargements at the <strong>proximal interphalangeal (PIP) joints</strong> of the fingers. The nurse documents these as:</p>","explanation":"<p><strong>Bouchard's nodes</strong> are bony swellings at the PIP joints — the fingerprint of osteoarthritis. (Heberden's nodes, the classic distractor, sit at the DIP joints — one knuckle farther out.) Both arise from the osteophytes (bone spurs) that form at the margins of cartilage loss. Memory hook: <strong>“Bouchard's bumps”</strong> — pebbles on the middle knuckle; <strong>“Herberden's at the end (DIP = tip).”</strong></p>","answers":["<p>Tophi</p>","<p>Heberden's nodes</p>","<p>Bouchard's nodes</p>","<p>Ulnar deviation</p>"],"feedbacks":["","","<p>CORRECT — Bouchard's nodes are bony swellings at the PIP joints in osteoarthritis. Tophi (A) belong to gout; Heberden's nodes (B) are at the DIP joints; ulnar deviation (D) suggests rheumatoid arthritis.</p>",""]},"correct_response":["c"]},
        {"_class":"assessment","id":24008,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A nurse is reviewing activity guidelines with a client who has osteoarthritis. All of the following recommendations are appropriate <strong>EXCEPT</strong>:</p>","explanation":"<p>OA joints run on worn cartilage — “deep aching pain relieved by rest” is the classic pattern — so the rule is <strong>low-impact, non-weight-bearing exercise</strong> (swimming, cycling). Running/weight-bearing pounding is the exception. Keep the contrast straight: <strong>weight-bearing exercise is the hero for osteoPOROSIS (bone) but the villain for osteoARTHRITIS (joint)</strong>. Same word, opposite orders.</p>","answers":["<p>“Use low-impact exercises such as swimming or cycling.”</p>","<p>“Choose non-weight-bearing activities to reduce stress on the joints.”</p>","<p>“Begin a daily jogging program — weight-bearing exercise will strengthen the joints.”</p>","<p>“Rest the joint when the deep aching pain flares.”</p>"],"feedbacks":["","","<p>This is the EXCEPT answer — for osteoarthritis, only low-impact and non-weight-bearing exercises are recommended; running/weight-bearing pounding accelerates the degenerative process. (Don't confuse with osteoporosis, where weight-bearing exercise IS beneficial.)</p>",""]},"correct_response":["c"]},
        {"_class":"assessment","id":24009,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A client reports pain in <strong>both hands</strong> with fatigue and a low-grade fever. Morning stiffness lasts about 75 minutes daily and symptoms have persisted for 2 months. These findings are most consistent with:</p>","explanation":"<p>Rheumatoid arthritis presents <strong>symmetrically</strong> (both hands mirror each other), with stiffness and swelling lasting <strong>over 6 weeks</strong>, prominent <strong>fatigue and low-grade fever</strong>, and <strong>morning stiffness over 60 minutes</strong> — while OA is usually asymmetric with morning stiffness <strong>under 30 minutes</strong>. Memory hook: RA is the “Sunrise Siege” — <strong>S</strong>ymmetric, <strong>S</strong>ystemic, holds joints hostage for <strong>S</strong>ixty-plus minutes every morning.</p>","answers":["<p>Osteoarthritis</p>","<p>Rheumatoid arthritis</p>","<p>Gout</p>","<p>Lyme disease</p>"],"feedbacks":["","<p>CORRECT — symmetric hand involvement + fatigue/low-grade fever + 75-minute morning stiffness + >6 weeks duration = RA. OA (A) is asymmetric with <30-minute morning stiffness; gout classically hits one big toe; Lyme needs a tick bite and bull's-eye rash.</p>","",""]},"correct_response":["b"]},
        {"_class":"assessment","id":24010,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A client arrives with a sudden red, hot, exquisitely painful <strong>big toe (first metatarsophalangeal joint)</strong> after a weekend of steak and beer. The nurse suspects gout. Which dietary teaching is priority?</p>","explanation":"<p>Gout is inflammatory arthritis from <strong>hyperuricemia</strong> → urate crystals in joints; the big toe MTP joint is the classic site (<strong>podagra</strong>). Teach clients to avoid <strong>high-purine foods: organ meats, red meat, shellfish/oily fish, alcohol (especially beer), and sugary drinks</strong> — all raise uric acid. Memory hook: urate crystals are microscopic glass shards throwing a rave in the toe, and purine-rich foods are the party fuel.</p>","answers":["<p>“Avoid organ meats, red meat, shellfish, and beer — they are high in purines.”</p>","<p>“Avoid gluten-containing grains such as wheat, barley, and rye.”</p>","<p>“Avoid all dairy products, which worsen crystal formation.”</p>","<p>“Increase steak and shellfish intake to rebuild proteins lost in the flare.”</p>"],"feedbacks":["<p>CORRECT — high-purine foods (organ meats, red meat, shellfish/oily fish, beer, sugary drinks) raise uric acid and must be avoided. The gluten answer (B) belongs to celiac disease — a frequent cross-wiring trap.</p>","","",""]},"correct_response":["a"]},
        {"_class":"assessment","id":24011,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A warehouse worker reports chronic low-back pain that worsens with bending, lifting, and twisting, plus numbness and tingling radiating down one leg. When degenerative disc disease is suspected, which diagnostic approach does the nurse anticipate?</p>","explanation":"<p>DDD = gradual deterioration of the intervertebral discs (“the jelly donuts dry out and go flat”). Pain localizes to back/neck or radiates; neuropathy gives the “pins and needles”; motor weakness shows as trouble lifting or walking. Diagnosis per the course: <strong>physical exam and X-ray</strong>. The breath/blood test distractors are H. pylori tools trespassing from Module 5.</p>","answers":["<p>Urea breath test and stool antigen test</p>","<p>Physical exam and X-ray</p>","<p>Antibody blood tests</p>","<p>Immediate surgical exploration</p>"],"feedbacks":["","<p>CORRECT — DDD is confirmed with physical exam and X-ray. The symptom triad (chronic pain worse with bending/lifting/twisting + radiating neuropathy + possible motor weakness) fits disc deterioration. The other options belong to H. pylori workups or are not first-line.</p>","",""]},"correct_response":["b"]},
        {"_class":"assessment","id":24012,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A client returns from a hiking trip with an expanding red rash showing a <strong>bull's-eye pattern</strong> at a tick bite site, plus fever, chills, headache, and fatigue. The nurse anticipates which first-line treatment?</p>","explanation":"<p>This is <strong>Lyme disease</strong> (deer tick bite) with its calling card — <strong>erythema migrans</strong>, the bull's-eye rash — plus flu-like symptoms (fever, chills, headache, fatigue, muscle/joint aches, swollen lymph nodes). First-line treatment for early-stage Lyme = <strong>oral antibiotics</strong>. Memory hook: the deer tick is a graffiti artist that tags you with a target — fire back early with antibiotics before it goes systemic.</p>","answers":["<p>Apply a topical corticosteroid and monitor the rash for 3 weeks</p>","<p>Oral antibiotics</p>","<p>Immediate surgical debridement of the bite site</p>","<p>High-dose IV corticosteroids</p>"],"feedbacks":["","<p>CORRECT — early-stage Lyme disease is treated with oral antibiotics. The bull's-eye rash is erythema migrans at the tick-bite site; delaying treatment (A) risks systemic spread. Debridement and steroids are not indicated.</p>","",""]},"correct_response":["b"]},
        {"_class":"assessment","id":24013,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client reports progressive difficulty swallowing, with food “sticking” behind the sternum. Studies show <strong>incomplete relaxation of the lower esophageal sphincter (LES)</strong> with increased muscular tone and a <strong>lack of esophageal peristalsis</strong>. The nurse identifies this condition as:</p>","explanation":"<p>Achalasia is an esophageal motility problem of the esophageal smooth muscle: the LES won't relax (incomplete relaxation + increased tone) and peristalsis is absent — food can't be propelled into the stomach. Memory hook: the LES becomes the world's strictest <strong>bouncer — the velvet rope never lifts</strong>, and the conveyor belt inside is powered down.</p>","answers":["<p>Hiatal hernia</p>","<p>Peptic ulcer disease</p>","<p>Achalasia</p>","<p>Gastroenteritis</p>"],"feedbacks":["","","<p>CORRECT — achalasia = incomplete LES relaxation with increased tone + lack of esophageal peristalsis. In a hiatal hernia (A) the stomach slides through the diaphragm; PUD is open sores in the GI lining; gastroenteritis is the “stomach flu.”</p>",""]},"correct_response":["c"]},
        {"_class":"assessment","id":24014,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client with a known hiatal hernia develops sudden severe pain, persistent vomiting, and signs of bowel obstruction. The nurse recognizes these findings as indicating:</p>","explanation":"<p>In a hiatal hernia, part of the stomach pushes up through the diaphragm. The <strong>sliding type (~95%)</strong> causes dysphagia, substernal burning, and belching — managed with acid reducers ± surgery. But when the <strong>blood supply to the herniated tissue is cut off by pressure → tissue death</strong>, it's a <strong>strangulated hernia: a surgical emergency</strong> (severe pain, nausea, vomiting, obstruction signs). Memory hook: the stomach pops its head through the skylight — strangulation is when the skylight slams shut on its neck.</p>","answers":["<p>A sliding hiatal hernia — begin acid-reducing medication</p>","<p>Typical heartburn — recommend antacids at bedtime</p>","<p>A strangulated hernia — a surgical emergency requiring immediate attention</p>","<p>Gastroenteritis — encourage oral fluids</p>"],"feedbacks":["","","<p>CORRECT — strangulation cuts off blood supply to the herniated tissue (tissue death, obstruction signs) and demands immediate surgery. The sliding type (A) is the common, non-emergent form with dysphagia, burning, and belching.</p>",""]},"correct_response":["c"]},
        {"_class":"assessment","id":24015,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client is being transferred to the unit with acute cholecystitis and has a <strong>positive Murphy's sign</strong>. This finding indicates:</p>","explanation":"<p>Murphy's sign is the cholecystitis litmus test: press the <strong>right upper quadrant</strong>, ask the patient to take a <strong>deep breath</strong> — as the liver descends it pushes the inflamed gallbladder into the examiner's fingers, and the patient <strong>experiences pain and abruptly stops inhaling</strong>. Memory hook: the “deep-breath freeze.” The rebound-tenderness option (D) is peritonitis/appendicitis territory — a classic exam distractor.</p>","answers":["<p>The patient stops breathing in when the examiner palpates under the ribs and notes right-upper-quadrant tenderness</p>","<p>The patient stops breathing out when the examiner palpates under the ribs on the left upper side of the abdomen</p>","<p>The patient verbalizes pain when the lower right quadrant is palpated</p>","<p>The patient reports pain when pressure is applied to the right lower quadrant but increased pain when pressure is released</p>"],"feedbacks":["<p>CORRECT — positive Murphy's = inspiratory arrest: the patient stops breathing IN on deep inspiration during RUQ palpation. Watch the side (right, not left), the direction of breath (in, not out), and the quadrant — wrong-quadrant and rebound answers are classic traps.</p>","","",""]},"correct_response":["a"]},
        {"_class":"assessment","id":24016,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>The nurse provides discharge dietary teaching to a client recovering from cholecystitis. Which meal choice indicates the client understood the teaching?</p>","explanation":"<p>Post-cholecystitis diet = <strong>low fat, high fiber, lean protein</strong>. Why? Fat digestion requires bile, and the inflamed/obstructed gallbladder can't deliver it — fatty meals force painful gallbladder contraction against the obstruction. Memory hook: <strong>don't throw grease at a gripped gallbladder.</strong> Baked chicken with steamed carrots and rice is the poster meal; cheeseburgers, fried chicken, and creamy casseroles are the trap trio.</p>","answers":["<p>Cheeseburger with french fries</p>","<p>Baked chicken with steamed carrots and rice</p>","<p>Fried chicken with mashed potatoes and gravy</p>","<p>Sausage casserole with cream sauce</p>"],"feedbacks":["","<p>CORRECT — low-fat, high-fiber, lean-protein meals (baked chicken, steamed carrots, rice) fit post-cholecystitis teaching. The other meals are all high-fat: fat demands bile the inflamed gallbladder can't supply, triggering pain and poor digestion.</p>","",""]},"correct_response":["b"]},
        {"_class":"assessment","id":24017,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>The nurse is documenting a client's biliary diagnosis. Which term describes gallstones that have <strong>passed from the gallbladder and cystic duct into the common bile duct</strong>?</p>","explanation":"<p><strong>Choledocholithiasis</strong> = stones that migrated from the gallbladder/cystic duct into the common bile duct. Decode the name: <em>choledocho-</em> = common bile duct, <em>-lith-</em> = stone. Compare: <strong>cholelithiasis</strong> = stones sitting in the gallbladder; <strong>cholecystitis</strong> = gallbladder inflammation. Memory hook: the great gallstone jailbreak — out of the gallbladder, through the cystic duct tunnel, roadblock on the common bile duct interstate.</p>","answers":["<p>Cholecystitis</p>","<p>Cholelithiasis</p>","<p>Choledocholithiasis</p>","<p>Cholangiography</p>"],"feedbacks":["","","<p>CORRECT — choledocholithiasis. Cholelithiasis (B) is stones in the gallbladder itself; cholecystitis (A) is inflammation; cholangiography (D) is an imaging procedure, not a diagnosis.</p>",""]},"correct_response":["c"]},
        {"_class":"assessment","id":24018,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client presents to the clinic with <strong>abdominal pain between meals</strong>, pale skin, and <strong>hematemesis</strong>. The client acknowledges a history of NSAID overuse and alcohol abuse. What is the most likely diagnosis?</p>","explanation":"<p>Peptic ulcer disease = open sores on the lining of the stomach, duodenum, or esophagus. Pain = <strong>burning/gnawing, between meals or at night, relieved by eating or antacids</strong>. The three primary risk factors — the <strong>Three Arsonists</strong>: <strong>NSAID overuse, alcohol abuse, and H. pylori infection</strong>. Hematemesis and pallor signal the ulcer is bleeding.</p>","answers":["<p>Hiatal hernia</p>","<p>Crohn's disease</p>","<p>Pyloric stenosis</p>","<p>Peptic ulcer disease</p>"],"feedbacks":["","","","<p>CORRECT — between-meals burning pain + hematemesis + NSAID overuse + alcohol abuse = peptic ulcer disease. The three primary risk factors are NSAIDs, alcohol, and H. pylori. Hiatal hernia burns substernally with belching; Crohn's shows skip lesions; pyloric stenosis is an infant projectile-vomiting diagnosis.</p>"]},"correct_response":["d"]},
        {"_class":"assessment","id":24019,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>The provider suspects <strong>Helicobacter pylori</strong> infection. Which of the following is <strong>NOT</strong> used to diagnose H. pylori?</p>","explanation":"<p>Three tests detect H. pylori: <strong>urea breath test</strong> (the go-to outpatient test — non-invasive, detects active infection), <strong>stool antigen test</strong>, and <strong>antibody blood test</strong>. A <strong>CBC cannot diagnose H. pylori</strong> — it may show anemia from a bleeding ulcer, but it never identifies the bacterium. Memory hook: to catch the ringleader, detectives use <strong>breath, stool, blood (antibodies)</strong> — CBC didn't make the team.</p>","answers":["<p>Urea breath test</p>","<p>Stool antigen test</p>","<p>Antibody blood test</p>","<p>Complete blood count (CBC)</p>"],"feedbacks":["","","","<p>This is the EXCEPT answer — CBC is NOT a diagnostic test for H. pylori. The three valid tests are the urea breath test (most common outpatient), stool antigen test, and antibody blood test."]},"correct_response":["d"]},
        {"_class":"assessment","id":24020,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client with a history of chronic alcohol use presents with <strong>severe epigastric pain radiating to the back</strong> that is worse when lying supine, plus nausea, vomiting, fever, and hypotension. The nurse notes a <strong>bluish-purplish discoloration around the umbilicus</strong>. This discoloration is documented as:</p>","explanation":"<p>The presentation is <strong>acute pancreatitis</strong> — sudden pancreatic inflammation whose two most common causes are <strong>gallstones (cholelithiasis) and chronic alcohol abuse</strong> (“Stones and Shots”). The periumbilical bruising is <strong>Cullen's sign</strong> — bluish/purplish discoloration around the umbilicus indicating <strong>retroperitoneal/internal hemorrhage</strong> (hemorrhagic pancreatitis). (Grey Turner's sign, the distractor, bruises the <strong>flanks</strong>, not the umbilicus.) Memory hook: Cullen's sign = a bruise halo around the belly button — the abdomen's internal-bleeding siren.</p>","answers":["<p>Cullen's sign — indicating internal hemorrhage</p>","<p>Grey Turner's sign — bruising of the flanks</p>","<p>Erythema migrans — a bull's-eye rash</p>","<p>Jaundice — yellowing of the skin</p>"],"feedbacks":["<p>CORRECT — Cullen's sign is bluish/purplish discoloration around the umbilicus, a red flag for retroperitoneal hemorrhage in severe pancreatitis. Grey Turner's (B) is flank bruising; erythema migrans (C) is the Lyme bull's-eye; jaundice (D) is yellow, not bluish, and not localized to the umbilicus.</p>","","",""]},"correct_response":["a"]},
        {"_class":"assessment","id":24021,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client has left-lower-quadrant pain, and imaging shows inflamed pouches protruding from the <strong>sigmoid colon</strong> wall, packed with stagnant intestinal contents. The nurse recognizes this as:</p>","explanation":"<p>Diverticulitis: weak areas of the bowel wall form pouches (diverticula), most commonly in the <strong>sigmoid colon</strong>; the pouches fill with stagnant intestinal contents → obstruction and inflammation of the bowel wall. Memory hook: the colon wall is a bicycle tire — <strong>weak spots balloon out like inner-tube bulges</strong>, get clogged, and inflame.</p>","answers":["<p>Ulcerative colitis</p>","<p>Celiac disease</p>","<p>Diverticulitis</p>","<p>Peptic ulcer disease</p>"],"feedbacks":["","","<p>CORRECT — inflammation of bowel-wall pouches (diverticula, usually sigmoid colon) filled with stagnant contents = diverticulitis. UC involves continuous mucosal ulcers of the colon starting at the rectum; celiac = gluten-driven villi damage; PUD = open sores in stomach/duodenum/esophagus.</p>",""]},"correct_response":["c"]},
        {"_class":"assessment","id":24022,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>After a potluck, several attendees — including your client — develop vomiting and diarrhea. The client asks, “Why didn't my flu shot prevent this stomach flu?” The nurse's best response:</p>","explanation":"<p>Gastroenteritis — the “stomach flu” — is <strong>inflammation of the stomach and intestines caused by viruses, bacteria, parasites, or their toxins</strong> (person-to-person, water, or foodborne). It is <strong>unrelated to influenza</strong>, so the flu vaccine can't touch it. Memory hook: the “stomach flu” is an identity thief borrowing influenza's name.</p>","answers":["<p>“The flu shot needs two weeks to work — your exposure came too soon.”</p>","<p>“Stomach flu is gastroenteritis — inflammation of the stomach and intestines from viruses, bacteria, parasites, or toxins; it is unrelated to influenza, so the flu vaccine doesn't cover it.”</p>","<p>“You likely received the wrong strain of flu vaccine this year.”</p>","<p>“Stomach flu IS influenza — the vaccine simply failed.”</p>"],"feedbacks":["","<p>CORRECT — gastroenteritis is caused by enteric pathogens and their toxins (food-, water-, or person-to-person), not the influenza virus, so the flu shot can't prevent it. The remaining options wrongly treat “stomach flu” as influenza.</p>","",""]},"correct_response":["b"]},
        {"_class":"assessment","id":24023,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>Which hepatitis virus is transmitted through <strong>blood, body fluids, and sexual contact</strong> AND has an <strong>available vaccine</strong>?</p>","explanation":"<p>The alphabet tells the story: <strong>A = Anus-oral</strong> (fecal-oral route, contaminated food/water; vaccine ✔), <strong>B = Blood &amp; Bedroom</strong> (blood, body fluids, sexual contact; vaccine ✔), <strong>C = Circulation</strong> (blood-to-blood, e.g., shared needles; <strong>NO widely accepted vaccine ✘</strong>). The two exam traps this one question kills: “vaccine + blood/sexual route” = B; “needles, no vaccine” = C. All three are detected by antibody tests.</p>","answers":["<p>Hepatitis A (HAV)</p>","<p>Hepatitis B (HBV)</p>","<p>Hepatitis C (HCV)</p>","<p>Hepatitis E (HEV)</p>"],"feedbacks":["","<p>CORRECT — HBV is blood/body-fluid/sexual-contact transmitted and has an available vaccine. HAV also has a vaccine but is fecal-oral (contaminated food or water). HCV fits the blood/needle route but has NO widely accepted vaccine.</p>","",""]},"correct_response":["b"]},
        {"_class":"assessment","id":24024,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client undergoes colonoscopy for chronic abdominal pain, diarrhea, and weight loss. Findings show <strong>inflamed areas of bowel separated by completely healthy segments</strong>, involving multiple sites along the GI tract. This pattern is characteristic of:</p>","explanation":"<p><strong>Skip lesions</strong> — diseased patches between healthy areas, anywhere in the GI tract — are the Crohn's signature. UC is the opposite: <strong>continuous inflammation limited to the colon and rectum, starting in the rectum and extending proximally</strong>, involving the innermost lining. Memory hook: Crohn's is the <strong>guerrilla fighter</strong> (ambush anywhere, patchy strikes); UC is the <strong>steamroller</strong> (colon-only, continuous grind from the rectum up). Chant: <strong>“UC = Uniform &amp; Continuous; Crohn's = Crisscross.”</strong></p>","answers":["<p>Ulcerative colitis</p>","<p>Crohn's disease</p>","<p>Diverticulitis</p>","<p>Peptic ulcer disease</p>"],"feedbacks":["","<p>CORRECT — skip lesions anywhere in the GI tract = Crohn's disease. Ulcerative colitis would show continuous inflammation limited to the colon and rectum, starting at the rectum without skipping segments.</p>","",""]},"correct_response":["b"]},
        {"_class":"assessment","id":24025,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client with celiac disease reports <strong>pale, foul-smelling, greasy stools</strong>. The nurse documents this finding as:</p>","explanation":"<p><strong>Steatorrhea = loss of fat in the stool</strong> — and it typically develops in <strong>celiac disease</strong>: gluten triggers an autoimmune attack that flattens the small-intestine villi (the “shag carpet” gets bulldozed to bare tile), so fat can't be absorbed and slides straight through. Management: a strict lifelong gluten-free diet. Hematochezia (A) = bright red blood; melena (B) = black tarry stool.</p>","answers":["<p>Hematochezia</p>","<p>Melena</p>","<p>Steatorrhea</p>","<p>Achalasia</p>"],"feedbacks":["","","<p>CORRECT — steatorrhea (fat in the stool) develops in celiac disease because the damaged intestinal villi can no longer absorb fat. Hematochezia is frank blood; melena is digested blood (black, tarry); achalasia is an esophageal motility disorder.</p>",""]},"correct_response":["c"]}
        ]};
        let answeredQuestions = new Set();

        function smartLinkify(text) {
            if (!text) return "";
            const regex = /((?:href|src)=["'])(https?:\/\/[^"']+)["']|(https?:\/\/[^\s<>"']+)/g;
            let processed = text.replace(regex, (match, prefix, quotedUrl, rawUrl) => {
                if (prefix) return match;
                if (rawUrl) return '<a href="' + rawUrl + '" target="_blank">' + rawUrl + '</a>';
                return match;
            });
            return processed.replace(/\n/g, '<br>');
        }

        function init() {
            const container = document.getElementById('questions-container');
            quizData.questions.forEach((q, index) => {
                container.appendChild(createQuestionCard(q, index + 1));
            });
            setupImageZoom();
            updateStats();
        }

        function updateStats() {
            const total = quizData.questions.length;
            let correct = 0;
            let wrong = 0;

            document.querySelectorAll('.question-card.answered').forEach(card => {
                const hasWrong = card.querySelector('.option.user-wrong');
                if (hasWrong) {
                    wrong++;
                } else {
                    correct++;
                }
            });

            const answered = answeredQuestions.size;
            const remaining = total - answered;
            const score = answered > 0 ? Math.round((correct / total) * 100) : 0;

            document.getElementById('val-score').innerText = score + '%';
            document.getElementById('val-correct').innerText = correct;
            document.getElementById('val-wrong').innerText = wrong;
            document.getElementById('val-remain').innerText = remaining;
        }

        function createQuestionCard(qData, qNum) {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.dataset.id = qData.id;

            const prompt = qData.prompt || {};
            const answers = prompt.answers || [];
            const correctResponses = qData.correct_response || [];
            const feedbacks = qData.feedbacks || prompt.feedbacks || [];

            let overallExplanation = prompt.explanation || "";
            overallExplanation = smartLinkify(overallExplanation);

            const isMulti = correctResponses.length > 1;
            card.dataset.correct = JSON.stringify(correctResponses);
            card.dataset.isMulti = isMulti;

            const modTag = qData.module === 'M4'
                ? '<span class="module-tag mt-m4">MODULE 4 · MSK</span>'
                : (qData.module === 'M5' ? '<span class="module-tag mt-m5">MODULE 5 · GI</span>' : '');

            let optionsHTML = '';
            answers.forEach((ans, idx) => {
                const letter = String.fromCharCode(97 + idx);
                let ansText = typeof ans === 'string' ? ans : (ans.body || ans.content || '');
                let contentFeedback = feedbacks[idx] || "";
                contentFeedback = smartLinkify(contentFeedback);
                const feedbackHtml = contentFeedback ? '<div class="feedback-text">' + contentFeedback + '</div>' : '';

                optionsHTML += `
                    <li class="option" data-idx="${idx}" data-letter="${letter}" onclick="selectOption(this)">
                        <div class="option-content">
                            <span class="chk ${isMulti ? 'checkbox' : 'radio'}"></span>
                            <div style="flex:1">${ansText}</div>
                        </div>
                        ${feedbackHtml}
                    </li>`;
            });

            const qText = prompt.question || prompt.text || '';

            card.innerHTML = `
                <div class="q-header">Question ${qNum} ${modTag}</div>
                <div class="q-body">${qText}</div>
                <ul class="q-answers">${optionsHTML}</ul>
                <div class="btn-submit-container">
                    <button class="btn-submit" onclick="submitAnswer(this)">Answer</button>
                </div>

                <div class="explanation-wrapper">
                    <button class="btn-explain" onclick="toggleExplanation(this)">
                        <i class="fas fa-lightbulb"></i> Explanation
                    </button>
                    <div class="overall-explanation">
                        <h4>Overall Explanation</h4>
                        <div>${overallExplanation}</div>
                    </div>
                </div>
            `;
            return card;
        }

        function selectOption(el) {
            const card = el.closest('.question-card');
            if (card.classList.contains('answered')) return;
            const isMulti = card.dataset.isMulti === 'true';
            if (isMulti) {
                el.classList.toggle('selected');
            } else {
                card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                el.classList.add('selected');
            }
        }

        function submitAnswer(btn) {
            const card = btn.closest('.question-card');
            if (card.classList.contains('answered')) return;

            const selectedOpts = card.querySelectorAll('.option.selected');
            if (selectedOpts.length === 0) return;

            card.classList.add('answered');
            answeredQuestions.add(card.dataset.id);
            const correctArr = JSON.parse(card.dataset.correct);
            btn.disabled = true;

            card.querySelectorAll('.option').forEach(opt => {
                const letter = opt.dataset.letter;
                const isCorrect = correctArr.includes(letter);
                const isSelected = opt.classList.contains('selected');

                if (isCorrect) {
                    opt.classList.add('show-correct');
                } else if (isSelected) {
                    opt.classList.add('user-wrong');
                }
            });

            const explanationDiv = card.querySelector('.overall-explanation div');
            if (explanationDiv && explanationDiv.innerHTML.trim() !== '') {
                card.querySelector('.explanation-wrapper').style.display = 'block';
            }

            setupImageZoom();
            updateStats();
        }

        function toggleExplanation(btn) {
            const wrapper = btn.closest('.explanation-wrapper');
            const content = wrapper.querySelector('.overall-explanation');

            if (content.style.display === 'block') {
                content.style.display = 'none';
                btn.innerHTML = '<i class="fas fa-lightbulb"></i> Explanation';
            } else {
                content.style.display = 'block';
                btn.innerHTML = '<i class="fas fa-chevron-up"></i> Hide Explanation';
            }
        }

        function resetQuiz() {
            answeredQuestions.clear();
            document.querySelectorAll('.question-card').forEach(c => {
                c.classList.remove('answered');
                c.querySelectorAll('.option').forEach(o => {
                    o.classList.remove('selected', 'user-wrong', 'show-correct');
                });
                c.querySelector('.btn-submit').disabled = false;

                const wrapper = c.querySelector('.explanation-wrapper');
                if(wrapper) {
                    wrapper.style.display = 'none';
                    const content = wrapper.querySelector('.overall-explanation');
                    if(content) content.style.display = 'none';
                    const btnExp = wrapper.querySelector('.btn-explain');
                    if(btnExp) btnExp.innerHTML = '<i class="fas fa-lightbulb"></i> Explanation';
                }
            });
            updateStats();
            window.scrollTo({top:0, behavior:'smooth'});
        }

        function setupImageZoom() {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("img01");
            document.querySelectorAll('img').forEach(img => {
                if(img.closest('#imageModal')) return;
                img.onclick = function() {
                    modal.style.display = "block";
                    modalImg.src = this.src;
                }
            });
        }
        function closeModal() { document.getElementById("imageModal").style.display = "none"; }
        window.onclick = function(e) { if (e.target == document.getElementById("imageModal")) closeModal(); }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
