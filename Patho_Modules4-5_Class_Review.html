<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patho Modules 4 &amp; 5 — Class Review</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- Base Styles --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f8; padding: 30px; color: #333; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }

        h1 { text-align: center; color: #2c3e50; margin-bottom: 6px; font-size: 1.8em; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 20px; font-size: 0.95em; }

        /* --- Score Board Style --- */
        .score-board {
            display: flex; justify-content: space-around; background: white;
            padding: 15px; margin-bottom: 25px; border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e1e4e8;
        }
        .score-item { text-align: center; }
        .score-val { font-size: 1.5em; font-weight: bold; display: block; }
        .score-lbl { font-size: 0.85em; color: #7f8c8d; text-transform: uppercase; font-weight: 600; }

        .c-purple { color: #8e44ad; }
        .c-green { color: #27ae60; }
        .c-red { color: #e74c3c; }
        .c-grey { color: #7f8c8d; }

        .btn-reset-container { text-align: center; margin-bottom: 30px; }
        .btn-reset {
            background-color: #34495e; color: white; border: none; padding: 8px 16px;
            border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600;
            transition: 0.2s;
        }
        .btn-reset:hover { background-color: #2c3e50; }

        /* --- Question Card --- */
        .question-card {
            background: white; padding: 25px; margin-bottom: 25px;
            border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid #e1e4e8;
        }

        .q-header { font-weight: 700; color: #7f8c8d; margin-bottom: 15px; font-size: 0.9em; text-transform: uppercase; }
        .q-body { font-size: 1.2em; margin-bottom: 20px; color: #2c3e50; font-weight: 500; }

        /* Images */
        .question-card img, .feedback-text img, .overall-explanation img {
            max-width: 100% !important; height: auto !important; display: block;
            margin: 15px auto; border-radius: 6px; cursor: zoom-in;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .q-answers { list-style: none; padding: 0; }

        /* --- Option Styles --- */
        .option {
            padding: 15px 20px; border: 2px solid #e1e4e8; margin-bottom: 12px; border-radius: 8px;
            cursor: pointer; transition: all 0.2s ease; background: white;
            display: flex; flex-direction: column;
        }

        .option-content { display: flex; align-items: flex-start; gap: 15px; width: 100%; }

        .option:hover:not(.answered) { border-color: #bdc3c7; background-color: #f8f9fa; }
        .option.selected:not(.answered) { border-color: #34495e; background-color: #edf2f7; }

        /* Icons */
        .chk {
            font-size: 1.1em; flex-shrink: 0; width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #bdc3c7; background: white; margin-top: 2px;
        }
        .chk.radio { border-radius: 50%; }
        .chk.checkbox { border-radius: 4px; }

        .option.selected .chk { border-color: #2c3e50; background: #2c3e50; }
        .option.selected .chk::after { content: ''; display: block; width: 10px; height: 10px; background: white; border-radius: 50%; }

        /* --- Feedback Section --- */
        .feedback-text {
            margin-top: 15px; padding: 12px 15px; font-size: 0.95em;
            border-left: 4px solid; background-color: rgba(255,255,255,0.5);
            border-radius: 0 4px 4px 0; animation: fadeIn 0.3s ease;
            display: none;
        }
        .feedback-text:empty { display: none !important; }

        /* --- Overall Explanation Button & Section --- */
        .explanation-wrapper {
            margin-top: 20px;
            display: none;
        }

        .btn-explain {
            background-color: #f39c12; color: white; border: none;
            padding: 10px 20px; border-radius: 6px; cursor: pointer;
            font-size: 14px; font-weight: 600; display: inline-flex;
            align-items: center; gap: 8px; transition: 0.2s;
        }
        .btn-explain:hover { background-color: #d68910; }

        .overall-explanation {
            display: none;
            margin-top: 15px; padding: 20px;
            background-color: #fff8e1; border: 1px solid #ffe0b2;
            border-radius: 8px; color: #333; animation: fadeIn 0.5s ease;
            overflow-wrap: break-word;
        }
        .overall-explanation h4 {
            margin: 0 0 10px 0; color: #e67e22; font-size: 1em;
            text-transform: uppercase; font-weight: 700;
        }

        /* --- States After Submit --- */
        .option.user-wrong { border-color: #e74c3c; background-color: #fdecea; cursor: default; }
        .option.user-wrong .chk { border-color: #e74c3c; background: #e74c3c; }
        .option.user-wrong .chk::after { content: '✕'; color: white; background: none; font-size: 16px; font-weight: bold; width: auto; height: auto; }
        .option.user-wrong .feedback-text { display: block; border-color: #c0392b; color: #c0392b; background-color: rgba(231, 76, 60, 0.1); }

        .option.show-correct { border-color: #27ae60; background-color: #e8f8f5; cursor: default; }
        .option.show-correct .chk { border-color: #27ae60; background: #27ae60; }
        .option.show-correct .chk::after { content: '✓'; color: white; background: none; font-size: 16px; font-weight: bold; width: auto; height: auto; }
        .option.show-correct .feedback-text { display: block; border-color: #27ae60; color: #1e8449; background-color: rgba(39, 174, 96, 0.1); font-weight: 500; }

        .btn-submit-container { margin-top: 20px; }
        .btn-submit { background-color: #2980b9; color: white; border: none; padding: 12px 30px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; }
        .btn-submit:hover { background-color: #2471a3; }
        .btn-submit:disabled { opacity: 0.7; cursor: default; }

        /* Module tag */
        .module-tag { display: inline-block; font-size: 0.75em; font-weight: 700; padding: 3px 10px; border-radius: 12px; margin-left: 8px; vertical-align: middle; }
        .mt-m4 { background: #eaf2fb; color: #2980b9; border: 1px solid #bdd7f0; }
        .mt-m5 { background: #fdeeee; color: #c0392b; border: 1px solid #f2c6c0; }

        /* Modal Zoom */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); }
        .modal-content { margin: auto; display: block; max-width: 90%; max-height: 90vh; }
        .close { position: absolute; top: 15px; right: 35px; color: #fff; font-size: 40px; cursor: pointer; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Patho Modules 4 &amp; 5 — Class Review</h1>
        <div class="subtitle">Musculoskeletal &amp; Digestive Disorders &middot; 25 Questions</div>

        <div class="score-board">

                <span class="score-val c-purple" id="val-score">0%</span>

                <span class="score-val c-green" id="val-correct">0</span>

                <span class="score-val c-grey" id="val-remain">0</span>

            </div>
        </div>

        <div class="btn-reset-container">
            <button class="btn-reset" onclick="resetQuiz()">Reset Quiz</button>

    </div>

    <script>
        const quizData = {"quiz_title":"Patho Modules 4 & 5 — Class Review","questions":[
{"_class":"assessment","id":24001,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A 58-year-old woman, three years post-menopause, has a bone density screening that shows thinning of the trabecular matrix — below normal, but not at the severity of osteoporosis. She asks the nurse, “Does this mean I need bone medication right away?” Which response is best?</p>","explanation":"<p>Her finding is <strong>osteopenia</strong> — the precursor state to osteoporosis, most common in older adults and especially postmenopausal women as bone density declines with age and estrogen loss. It is a <strong>warning sign, not a diagnosis requiring immediate treatment</strong>: management centers on prevention — calcium, vitamin D, and weight-bearing exercise. Memory hook: <strong>the yellow traffic light</strong> before osteoporosis's red light — you don't call a tow truck at yellow, you just drive smarter.</p>","answers":["<p>“Yes — this result means you should start bisphosphonate therapy immediately.”</p>","<p>“This is osteopenia — an early warning sign. Right now the goal is prevention: calcium, vitamin D, and weight-bearing exercise.”</p>","<p>“This means you already have osteoporosis, so you should stop exercising to protect your bones.”</p>","<p>“This result is normal for your age, so no changes or follow-up are needed.”</p>"],"feedbacks":["","<p>Osteopenia is bone loss BELOW osteoporosis severity — a clinical warning sign managed with prevention (calcium, vitamin D, weight-bearing exercise), not immediate drug therapy. Calling it “normal” (D) or jumping to bisphosphonates (A) both miss the point; stopping exercise (C) would accelerate bone loss.</p>","",""]},"correct_response":["b"]},
{"_class":"assessment","id":24002,"assessment_type":"multi-select","module":"M4","prompt":{"question":"<p>The nurse is running a community bone-health booth and decides which attendees to <strong>prioritize for osteoporosis screening</strong>. <strong>Select all that apply.</strong></p>","explanation":"<p>Screen the risk-factor buckets: <strong>Age</strong> (density declines), <strong>Gender/estrogen</strong> (postmenopausal women — estrogen protects bone, so losing it accelerates resorption), <strong>Lifestyle</strong> (poor diet, inactivity, smoking, excessive alcohol), and <strong>Medications</strong> (long-term corticosteroids like prednisone). The runner and the calcium-taking walker are doing protective behaviors — reversal traps. Memory hook: bone is a bank and <strong>estrogen is the security guard — menopause fires the guard</strong> and the osteoclasts rob the vault.</p>","answers":["<p>A 70-year-old woman who went through menopause at age 48</p>","<p>A 55-year-old man who takes long-term prednisone</p>","<p>A 62-year-old woman who smokes and drinks alcohol daily</p>","<p>A 40-year-old man who trains for marathons</p>","<p>A 35-year-old woman who takes calcium daily and walks regularly</p>"],"feedbacks":["<p>Prioritize: postmenopausal women (estrogen decline — A), long-term corticosteroid users (B), and smokers/heavy drinkers (C). Marathon training (D) and calcium + walking (E) are PROTECTIVE weight-bearing behaviors — the mirror-image of the risk-factor list, and exactly the kind of reversal distractor exams use.</p>","<p>Prioritize: postmenopausal women (estrogen decline — A), long-term corticosteroid users (B), and smokers/heavy drinkers (C). Marathon training (D) and calcium + walking (E) are PROTECTIVE weight-bearing behaviors — the mirror-image of the risk-factor list, and exactly the kind of reversal distractor exams use.</p>","<p>Prioritize: postmenopausal women (estrogen decline — A), long-term corticosteroid users (B), and smokers/heavy drinkers (C). Marathon training (D) and calcium + walking (E) are PROTECTIVE weight-bearing behaviors — the mirror-image of the risk-factor list, and exactly the kind of reversal distractor exams use.</p>","<p>Prioritize: postmenopausal women (estrogen decline — A), long-term corticosteroid users (B), and smokers/heavy drinkers (C). Marathon training (D) and calcium + walking (E) are PROTECTIVE weight-bearing behaviors — the mirror-image of the risk-factor list, and exactly the kind of reversal distractor exams use.</p>","<p>Prioritize: postmenopausal women (estrogen decline — A), long-term corticosteroid users (B), and smokers/heavy drinkers (C). Marathon training (D) and calcium + walking (E) are PROTECTIVE weight-bearing behaviors — the mirror-image of the risk-factor list, and exactly the kind of reversal distractor exams use.</p>"]},"correct_response":["a","b","c"]},
{"_class":"assessment","id":24003,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>An 80-year-old woman with osteoporosis tells the nurse she has “shrunk almost two inches” this year, and her daughter points out that her upper back has become noticeably rounded. The nurse explains that these changes most likely result from:</p>","explanation":"<p>Height loss plus a rounding upper back = <strong>kyphosis from osteoporotic vertebral compression fractures</strong>. Osteoporosis thins and weakens bone; vertebrae quietly crush under load, and the spine bows forward. Memory hook: the hunched back is the skeleton's quiet confession that the vault got robbed — each crushed vertebra bows it lower.</p>","answers":["<p>Vertebral compression fractures producing kyphosis</p>","<p>A bacterial infection of the spinal column</p>","<p>Degeneration of the disc cushions pinching the spinal cord</p>","<p>An autoimmune attack inflaming the back muscles</p>"],"feedbacks":["<p>CORRECT — in osteoporosis, weakened vertebrae compress, causing height loss and the exaggerated outward curvature of kyphosis. Bone infection (B) = osteomyelitis; disc degeneration (C) = DDD; muscle inflammation (D) = myositis. Each distractor is a real module term — match the finding to the right disease.</p>","","",""]},"correct_response":["a"]},
{"_class":"assessment","id":24004,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>The nurse is helping a client newly diagnosed with osteoporosis build a weekly routine. Which plan is most appropriate?</p>","explanation":"<p>Osteoporosis management = calcium and vitamin D supplementation, <strong>weight-bearing exercise</strong> (walking, low-impact aerobics, resistance training), bisphosphonates, and consider hormone therapy. Bone responds to load — Wolff's law in plain clothes. The name trap: weight-bearing exercise is the hero for <strong>osteoPOROSIS (bone)</strong> but the villain for <strong>osteoARTHRITIS (joint)</strong>, where low-impact non-weight-bearing rules.</p>","answers":["<p>Strict rest with minimal walking to avoid any fracture risk</p>","<p>Brisk walking or low-impact aerobics most days, with calcium and vitamin D as prescribed</p>","<p>Daily swimming as the primary bone-strengthening exercise</p>","<p>Postponing all physical activity until the bone density improves on its own</p>"],"feedbacks":["","<p>Bone gets stronger when it bears load — that's why walking/low-impact aerobics anchors the plan alongside calcium/vit D (and medications like bisphosphonates as prescribed). Swimming (C) is beautiful cardio but non-weight-bearing; total rest (A, D) speeds up bone loss.</p>","",""]},"correct_response":["b"]},
{"_class":"assessment","id":24005,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A nursing student is documenting the progression of a client's bone infection. Which sequence lists the stages of osteomyelitis in the correct order, from initial infection to final response?</p>","explanation":"<p>Correct march: <strong>(1) Inflammation</strong> — infection begins, swelling and pressure within bone; <strong>(2) Suppuration</strong> — pus forms; infectious material enters the Haversian system and an abscess forms; <strong>(3) Sequestrum</strong> — bone necrosis (dead bone); <strong>(4) Involucrum</strong> — new bone forms around the dead bone. Memory hook: <strong>“I Saw Skeletons Inside”</strong> — fire in the bone, pus storms the Haversian hallways, a skeleton in the closet, then the body brick-walls the crime scene with new bone.</p>","answers":["<p>Inflammation → Suppuration → Sequestrum → Involucrum</p>","<p>Inflammation → Sequestrum → Suppuration → Involucrum</p>","<p>Suppuration → Inflammation → Involucrum → Sequestrum</p>","<p>Involucrum → Sequestrum → Suppuration → Inflammation</p>"],"feedbacks":["<p>CORRECT — “I Saw Skeletons Inside.” The body can't wall off dead bone (involucrum) before bone has died (sequestrum), and pus (suppuration) can't precede the initial infection (inflammation) — so any option starting with suppuration or involucrum is logically impossible.</p>","","",""]},"correct_response":["a"]},
{"_class":"assessment","id":24006,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>While examining the hands of a client with osteoarthritis, the nurse palpates hard, bony enlargements over the middle knuckles of both index fingers — Bouchard's nodes. At which joints are these located?</p>","explanation":"<p><strong>Bouchard's nodes sit at the PIP (proximal interphalangeal) joints</strong> — the middle knuckles. Their near-twin, Heberden's nodes, sits one joint farther out at the DIP joints. Both are osteophytes (bone spurs) forming at the margins of cartilage loss in OA. Memory hook: <strong>“Bouchard's bumps”</strong> on the middle knuckle; <strong>“Heberden's at the very end”</strong> (DIP = near the tip).</p>","answers":["<p>Distal interphalangeal (DIP) joints, closest to the fingertip</p>","<p>Proximal interphalangeal (PIP) joints, the middle knuckles</p>","<p>Metacarpophalangeal (MCP) joints, where the fingers meet the palm</p>","<p>The wrist (carpal) joints</p>"],"feedbacks":["","<p>CORRECT — Bouchard's nodes = PIP joints; Heberden's nodes (option A) = DIP joints. Keep the sisters straight: <strong>B</strong>ouchard's lives in the <strong>P</strong>ro<strong>P</strong> joints.</p>","",""]},"correct_response":["b"]},
{"_class":"assessment","id":24007,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A 66-year-old client with knee osteoarthritis — deep aching pain that eases with rest — asks the nurse to recommend a safe weekly exercise routine. Which choice is best?</p>","explanation":"<p>OA cartilage is worn tread on the tire; you don't punish bald tires on the highway — you <strong>float the joint: low-impact, non-weight-bearing exercise</strong> (swimming, water aerobics, cycling). Running and loaded squats grind bone-on-bone; total rest weakens the muscles that shield the joint. Contrast with osteoporosis, where weight-bearing load is exactly what you want — the two “osteo” disorders get OPPOSITE exercise orders.</p>","answers":["<p>A daily 3-mile jogging program to condition the joint</p>","<p>Swimming or water aerobics several times per week</p>","<p>Deep weighted squats to rebuild the knee cartilage</p>","<p>Complete knee rest — move the joint as little as possible</p>"],"feedbacks":["","<p>Low-impact, non-weight-bearing activity keeps the joint mobile and muscles strong without pounding worn cartilage. Jogging (A) accelerates the degenerative process, and cartilage doesn't “rebuild” (C) — but total rest (D) trades stiffness for weakness.</p>","",""]},"correct_response":["b"]},
{"_class":"assessment","id":24008,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A 47-year-old reports painful swelling of <strong>both wrists and both hands</strong>, along with unusual fatigue and a low-grade fever. Each morning the stiffness takes about 90 minutes to loosen, and symptoms have been present for eight weeks. This picture best fits:</p>","explanation":"<p>Rheumatoid arthritis is the <strong>“Sunrise Siege”</strong>: <strong>S</strong>ymmetric involvement (both sides mirror), <strong>S</strong>ystemic features (fatigue, low-grade fever), morning stiffness lasting <strong>S</strong>ixty-plus minutes, persisting <strong>over 6 weeks</strong>. OA is the contrast case: usually asymmetric, no fever/fatigue, and morning stiffness under 30 minutes.</p>","answers":["<p>Osteoarthritis</p>","<p>Gout</p>","<p>Rheumatoid arthritis</p>","<p>Lyme disease</p>"],"feedbacks":["","","<p>CORRECT — symmetric hand/wrist inflammation + systemic symptoms (fatigue, low-grade fever) + 90-minute morning stiffness + >6 weeks = RA. OA (A) would be asymmetric with <30-minute stiffness; gout (B) classically strikes one big toe; Lyme (D) needs the tick bite and bull's-eye rash.</p>",""]},"correct_response":["c"]},
{"_class":"assessment","id":24009,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A client being treated for gout is ordering dinner at a family restaurant. Based on the nurse's dietary teaching, which menu choice is best?</p>","explanation":"<p>Gout = hyperuricemia → urate crystals, classically in the big-toe MTP joint (<strong>podagra</strong>). The dietary rule: avoid <strong>high-purine</strong> foods — organ meats, red meat, shellfish/oily fish — and <strong>alcohol, especially beer</strong>, plus sugary drinks. Memory hook: purines are the <strong>party fuel</strong> for the glass-shard rave in the toe; grilled chicken with water is how you end the party.</p>","answers":["<p>Liver and onions with a glass of red wine</p>","<p>Grilled chicken with steamed vegetables and water</p>","<p>Shrimp scampi with two beers</p>","<p>A double steakhouse burger with a large beer</p>"],"feedbacks":["","<p>Lean poultry, vegetables, and water keep purines — and uric acid — low. Liver (organ meat), shrimp (shellfish), steak (red meat), and beer/alcohol are all on the avoid list; each wrong option smuggles in at least one high-purine item plus alcohol.</p>","",""]},"correct_response":["b"]},
{"_class":"assessment","id":24010,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A 52-year-old warehouse worker is being evaluated for chronic back pain. Which cluster of findings would make the nurse suspect degenerative disc disease?</p>","explanation":"<p>DDD = the spine's <strong>jelly donuts drying out</strong>: worn intervertebral discs produce <strong>chronic pain that worsens with bending, lifting, or twisting</strong>, possible motor weakness (trouble lifting or walking), and <strong>neuropathy</strong> — numbness, tingling, “pins and needles” radiating into an arm or leg. The study guide's diagnostic pair: <strong>physical exam and X-ray</strong>.</p>","answers":["<p>Pain that improves with bending and lifting, plus a swollen big toe</p>","<p>Burning pain between meals that food relieves, with pale stools</p>","<p>Chronic pain that worsens with bending, lifting, or twisting, plus tingling radiating down one leg</p>","<p>Symmetric wrist swelling with 90 minutes of morning stiffness</p>"],"feedbacks":["","","<p>CORRECT — chronic pain that flares with bending/lifting/twisting + radiating neuropathy (numbness, tingling, “pins and needles”) is the DDD signature; anticipatory diagnostics are physical exam + X-ray. Option D is RA, option B is upper-GI, option A is gout wearing a disguise.</p>",""]},"correct_response":["c"]},
{"_class":"assessment","id":24011,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>Ten days after a camping trip, a client develops an expanding circular red rash with a clear center — like an archery target — at the site of a tick bite, along with fever, headache, fatigue, and muscle aches. For this early-stage illness, the nurse anticipates:</p>","explanation":"<p>The target-shaped rash is <strong>erythema migrans</strong>, the calling card of <strong>Lyme disease</strong> (deer tick bite), accompanied by flu-like symptoms. First-line treatment for early Lyme: <strong>prompt oral antibiotics</strong> — waiting lets the infection go systemic. Note also: Lyme is tick-borne, NOT person-to-person, so isolation (D) is unnecessary. Memory hook: the tick <strong>tags you with a target</strong> — fire back early with antibiotics.</p>","answers":["<p>Observation only — the rash should fade on its own within a few weeks</p>","<p>A prompt course of oral antibiotics</p>","<p>Surgical excision of the skin around the bite site</p>","<p>Immediate isolation, since the illness spreads easily between people</p>"],"feedbacks":["","<p>CORRECT — early-stage Lyme disease is treated first-line with oral antibiotics. Erythema migrans (the bull's-eye) plus flu-like symptoms after a tick bite is the classic presentation; delaying treatment (A) risks dissemination, and Lyme is not transmitted person-to-person (D).</p>","",""]},"correct_response":["b"]},
{"_class":"assessment","id":24012,"assessment_type":"multiple-choice","module":"M4","prompt":{"question":"<p>A client with osteoporosis is prescribed once-weekly oral alendronate (a bisphosphonate). Which client statement shows the teaching was effective?</p>","explanation":"<p>Oral bisphosphonates irritate the esophagus and absorb poorly with food, so the rules are: <strong>take first thing in the morning with a full glass of plain water, stay upright at least 30 minutes, and eat nothing until that window passes</strong>. No chewing, no milk, no bedtime dosing, no doubling missed doses. This connects back to the study guide's osteoporosis management list, which names bisphosphonates alongside calcium/vit D and weight-bearing exercise.</p>","answers":["<p>“I'll take it at bedtime with a little milk to protect my stomach.”</p>","<p>“I'll chew the tablet so it starts working faster.”</p>","<p>“I'll take it in the morning with a full glass of water and stay upright for 30 minutes before breakfast.”</p>","<p>“If I miss my weekly dose, I'll take two tablets the next day to catch up.”</p>"],"feedbacks":["","","<p>CORRECT — morning dosing with a full glass of water + remaining upright 30+ minutes protects the esophagus and maximizes absorption. Milk (A) blocks absorption, chewing (B) and bedtime dosing raise esophageal-irritation risk, and missed doses are never doubled (D).</p>",""]},"correct_response":["c"]},
{"_class":"assessment","id":24013,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>For two years a client has felt food “stick” behind the breastbone — with solids AND liquids — and sometimes regurgitates undigested food. Testing shows the lower esophageal sphincter does not relax completely, muscular tone is increased, and the esophagus shows no peristalsis. Which condition fits these findings?</p>","explanation":"<p><strong>Achalasia</strong> — an esophageal motility disorder of the esophageal smooth muscle: <strong>incomplete LES relaxation</strong> with increased tone plus <strong>absent peristalsis</strong>. Memory hook: the LES becomes a <strong>bouncer who never lifts the velvet rope</strong>, and the conveyor belt behind him is powered down — food piles up at the door.</p>","answers":["<p>Sliding hiatal hernia</p>","<p>Achalasia</p>","<p>Peptic ulcer disease</p>","<p>Acute pancreatitis</p>"],"feedbacks":["","<p>CORRECT — the triad of incomplete LES relaxation, increased LES tone, and absent esophageal peristalsis defines achalasia. A sliding hernia (A) causes heartburn/belching as the stomach slides through the diaphragm; PUD is lining ulcers; pancreatitis is epigastric pain radiating to the back.</p>","",""]},"correct_response":["b"]},
{"_class":"assessment","id":24014,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>The nurse is triaging four clients in the surgical clinic. Which client should be evaluated for <strong>emergency surgery FIRST</strong>?</p>","explanation":"<p>A <strong>strangulated hernia</strong> — blood supply to the herniated tissue cut off by pressure, causing tissue death — presents with severe pain, nausea, vomiting, and signs of bowel obstruction. That is the surgical emergency. The sliding hiatal hernia (~95% of cases) brings dysphagia, substernal burning, and belching and is managed with acid-reducing medication ± elective surgery. Memory hook: strangulation is the skylight slamming shut on the stomach's neck.</p>","answers":["<p>A client whose hiatal hernia causes occasional heartburn and belching after meals</p>","<p>A client with a known hiatal hernia who now has severe pain, persistent vomiting, and signs of bowel obstruction</p>","<p>A client who reports mild difficulty swallowing dry foods</p>","<p>A client with burning epigastric pain between meals that antacids relieve</p>"],"feedbacks":["","<p>CORRECT — severe pain + persistent vomiting + obstruction signs on the background of a hernia = strangulation (blood supply cut off, tissue death) = emergency. The heartburn client (A) fits the common sliding type; option D is a peptic ulcer pattern.</p>","",""]},"correct_response":["b"]},
{"_class":"assessment","id":24015,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client with suspected gallbladder inflammation describes sharp epigastric pain radiating to the <strong>right scapula</strong>, worse with deep breaths. While the nurse palpates the right upper quadrant and asks the client to inhale deeply, the client winces and abruptly stops inhaling. The nurse documents this as:</p>","explanation":"<p>That is a <strong>positive Murphy's sign</strong> — the cholecystitis litmus test. As the patient inhales, the liver descends and pushes the inflamed gallbladder into the examiner's fingers; the patient feels pain and <strong>stops breathing in</strong> (inspiratory arrest). Add the hallmark symptom — epigastric pain radiating to the right scapula — and cholecystitis tops the list. Memory hook: the <strong>“deep-breath freeze.”</strong></p>","answers":["<p>Rebound tenderness, suggesting appendicitis</p>","<p>A positive Murphy's sign, supporting cholecystitis</p>","<p>Cullen's sign, suggesting internal hemorrhage</p>","<p>A normal, unremarkable abdominal response</p>"],"feedbacks":["","<p>CORRECT — pain with abrupt interruption of inhalation during RUQ palpation IS Murphy's sign. Rebound tenderness (A) is pain on RELEASE and points to peritoneal irritation/appendicitis; Cullen's (C) is bruising around the umbilicus — no palpation needed.</p>","",""]},"correct_response":["b"]},
{"_class":"assessment","id":24016,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client recovering from gallbladder inflammation is choosing an afternoon snack from the unit kitchen. Which choice tells the nurse the dietary teaching sank in?</p>","explanation":"<p>Post-cholecystitis eating = <strong>low fat, high fiber, lean protein</strong>. Fat digestion demands bile that the inflamed/obstructed gallbladder can't supply — fatty foods force painful contractions and pass through undigested. Memory hook: <strong>don't throw grease at a gripped gallbladder.</strong> Fruit and plain rice cakes keep fat near zero; chips, cheese crackers, and milkshakes are fat bombs.</p>","answers":["<p>Potato chips with onion dip</p>","<p>Cheese crackers and a cola</p>","<p>Sliced apple with a few plain rice cakes</p>","<p>A double-scoop milkshake</p>"],"feedbacks":["","","<p>CORRECT — apple slices + plain rice cakes = effectively fat-free, fitting the low-fat, high-fiber, lean-protein guidance. Every other snack is fat-dense: fat requires bile the recovering gallbladder can't deliver, so it triggers pain and maldigestion.</p>",""]},"correct_response":["c"]},
{"_class":"assessment","id":24017,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client develops right-upper-quadrant pain and new yellowing of the skin and eyes. Ultrasound shows a gallstone that has moved out of the gallbladder and is now obstructing the common bile duct. Which term names this finding?</p>","explanation":"<p><strong>Choledocholithiasis</strong> = gallstones that have passed from the gallbladder and cystic duct into the common bile duct — where they can block bile flow (hence the jaundice). Compare: <strong>cholelithiasis</strong> = stones still sitting in the gallbladder; <strong>cholecystitis</strong> = gallbladder inflammation. Memory hook: the <strong>gallstone jailbreak</strong> — out of the gallbladder, through the cystic-duct tunnel, roadblock on the common-bile-duct interstate.</p>","answers":["<p>Cholelithiasis</p>","<p>Cholecystitis</p>","<p>Choledocholithiasis</p>","<p>Cholangitis</p>"],"feedbacks":["","","<p>CORRECT — stones that migrated into the common bile duct are choledocholithiasis (choledocho- = common bile duct, -lith = stone). Cholelithiasis (A) is stones in the gallbladder itself; cholecystitis (B) is inflammation; cholangitis (D) is duct INFECTION — a possible complication, not the term for the stone's location.</p>",""]},"correct_response":["c"]},
{"_class":"assessment","id":24018,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client being treated for a peptic ulcer is going over discharge teaching before leaving the clinic. Which client statement requires the nurse to correct?</p>","explanation":"<p>PUD management targets the <strong>Three Arsonists: NSAID overuse, alcohol abuse, and H. pylori infection</strong> (PPIs + antibiotics when H. pylori is positive). Ulcer pain classically burns between meals or at night and eases with food or antacids. Swapping ibuprofen for acetaminophen and dropping alcohol are correct moves — “extra NSAIDs when the pain flares” is literally pouring fuel on a sore the NSAIDs helped burn.</p>","answers":["<p>“I'll switch to acetaminophen instead of ibuprofen for my headaches.”</p>","<p>“I've stopped drinking alcohol while the ulcer heals.”</p>","<p>“That gnawing pain between meals should settle if I eat something or take my antacid.”</p>","<p>“If the pain comes back, I'll take extra NSAIDs for a few days until it calms down.”</p>"],"feedbacks":["","","","<p>This is the statement to correct — NSAID overuse is one of the three primary PUD risk factors, and re-dosing NSAIDs during a flare perpetuates the ulcer. The other statements are all correct teaching: acetaminophen over NSAIDs, no alcohol, and pain that food/antacids relieve."]},"correct_response":["d"]},
{"_class":"assessment","id":24019,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>In an outpatient clinic, a client needs confirmation of an <strong>active H. pylori infection</strong> before starting eradication therapy. Which test should the nurse anticipate?</p>","explanation":"<p>The three H. pylori tests: <strong>urea breath test</strong> (the outpatient go-to — non-invasive and detects active infection), <strong>stool antigen test</strong>, and <strong>antibody blood test</strong> (shows exposure, which may be past). A <strong>CBC cannot diagnose H. pylori</strong> — it might catch anemia from a bleeding ulcer but never identifies the bacterium. Memory hook: to catch the ringleader, detectives use <strong>breath, stool, blood — the CBC didn't make the team</strong>.</p>","answers":["<p>Complete blood count</p>","<p>Urea breath test</p>","<p>Abdominal flat-plate X-ray</p>","<p>Murphy's sign assessment</p>"],"feedbacks":["","<p>CORRECT — the urea breath test is the most common outpatient test and detects active infection; the stool antigen test is the other valid option. A CBC (A) cannot diagnose H. pylori, and Murphy's sign (D) assesses gallbladders, not bacteria.</p>","",""]},"correct_response":["b"]},
{"_class":"assessment","id":24020,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client admitted with acute pancreatitis (epigastric pain radiating to the back, worse when supine, with nausea and fever) develops a NEW bluish-purplish discoloration around the umbilicus on hospital day two. Which nursing action is the priority?</p>","explanation":"<p>The new discoloration is <strong>Cullen's sign</strong> — bluish/purplish bruising around the umbilicus that signals <strong>retroperitoneal/internal hemorrhage</strong>. In pancreatitis it marks escalation toward hemorrhagic disease, so prompt provider notification is the priority — it is never an expected change to simply document. Bonus recall: the two most common causes of acute pancreatitis are <strong>gallstones and chronic alcohol abuse</strong> (“Stones and Shots”), and flank bruising (not umbilical) is Grey Turner's sign. Comfort tip: lying flat worsens the pain — side-lying with knees drawn up eases it.</p>","answers":["<p>Document it as an expected, harmless skin change of pancreatitis</p>","<p>Apply a warm compress to the periumbilical area</p>","<p>Encourage the client to lie flat for comfort</p>","<p>Notify the provider promptly — this can indicate internal hemorrhage</p>"],"feedbacks":["","","","<p>CORRECT — Cullen's sign (periumbilical bluish-purplish discoloration) indicates retroperitoneal hemorrhage; in an acute pancreatitis admission it signals severe/hemorrhagic progression and must be reported immediately. It is never benign (A), a warm compress (B) treats nothing, and lying flat (C) makes pancreatic pain WORSE."]},"correct_response":["d"]},
{"_class":"assessment","id":24021,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client newly diagnosed with diverticulitis asks the nurse, “How did these pockets form in my colon in the first place?” Which explanation is accurate?</p>","explanation":"<p>Diverticula are <strong>weak areas that pouch outward off the wall of the large intestine</strong> — most often the <strong>sigmoid colon</strong>. Those pouches trap stagnant intestinal contents, which leads to obstruction and inflammation of the bowel wall = diverticulitis. Memory hook: the colon wall is a bicycle tire — <strong>weak spots balloon out like inner-tube bulges</strong>, clog up, and inflame.</p>","answers":["<p>“Acid from your stomach burned ulcers into the lower bowel.”</p>","<p>“A viral infection attacked the lining of your stomach and intestines.”</p>","<p>“Weak spots in the bowel wall ballooned outward into small pouches — usually in the sigmoid colon — and stagnant intestinal contents became trapped in them, causing obstruction and inflammation.”</p>","<p>“Uric acid crystals built up inside the bowel wall.”</p>"],"feedbacks":["","","<p>CORRECT — diverticula = pouches from bowel-wall weakness, most common in the sigmoid colon; stagnant contents inside them drive the obstruction and inflammation. Option A describes a peptic ulcer, B describes gastroenteritis, and D describes gout — three impostors borrowed from other topics.</p>",""]},"correct_response":["c"]},
{"_class":"assessment","id":24022,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client home from a cruise says, “Half the ship got the stomach flu — why didn't my flu shot protect me?” Which response by the nurse is best?</p>","explanation":"<p>The “stomach flu” is <strong>gastroenteritis</strong> — inflammation of the stomach and intestines caused by <strong>viruses, bacteria, parasites, or their toxins</strong>, spreading person-to-person, by water, or by food. It is <strong>not influenza</strong>, so the influenza vaccine offers zero protection. Memory hook: the “stomach flu” is an <strong>identity thief</strong> borrowing influenza's name.</p>","answers":["<p>“The vaccine only works if it was given within two weeks of the cruise.”</p>","<p>“You must have received a mismatched flu strain this year.”</p>","<p>“What you describe is gastroenteritis — inflammation of the stomach and intestines from viruses, bacteria, parasites, or toxins. It isn't influenza at all, so the flu vaccine can't prevent it.”</p>","<p>“Stomach flu is intestinal influenza — unfortunately, vaccines sometimes fail.”</p>"],"feedbacks":["","","<p>CORRECT — gastroenteritis is caused by enteric pathogens and their toxins (food-, water-, or person-to-person), not the influenza virus, so no flu shot covers it. The other answers all wrongly treat “stomach flu” as influenza.</p>",""]},"correct_response":["c"]},
{"_class":"assessment","id":24023,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A nursing student says, “Before my clinical rotation, I should get vaccinated against hepatitis C, since it's spread by blood-to-blood contact.” Which correction should the nurse give?</p>","explanation":"<p>The hepatitis alphabet: <strong>A = Anus-oral</strong> (fecal-oral, contaminated food/water — vaccine ✔), <strong>B = Blood &amp; Bedroom</strong> (blood, body fluids, sexual contact — vaccine ✔), <strong>C = Circulation</strong> (blood-to-blood, e.g., shared needles — <strong>no widely accepted vaccine ✘</strong>). The student is right about the route and wrong about the vaccine; the vaccine-preventable bloodborne hepatitis is <strong>B</strong>.</p>","answers":["<p>“Hepatitis C is actually spread through contaminated food, so vaccination isn't relevant.”</p>","<p>“You're right about the blood-to-blood route, but there is no widely accepted vaccine for hepatitis C. The one you CAN be vaccinated against is hepatitis B — also bloodborne, plus body fluids and sexual contact.”</p>","<p>“Correct — the hepatitis C vaccine is recommended for all clinical staff.”</p>","<p>“Only hepatitis A has a vaccine available at this time.”</p>"],"feedbacks":["","<p>CORRECT — route right, vaccine wrong: HCV = blood-to-blood (needle sharing) with NO widely accepted vaccine; HBV = blood/body fluids/sexual contact WITH a vaccine; HAV = fecal-oral WITH a vaccine. One sentence fixes the whole family.</p>","",""]},"correct_response":["b"]},
{"_class":"assessment","id":24024,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client with months of bloody diarrhea has a colonoscopy showing ulcers in a <strong>continuous pattern starting in the rectum and extending upward through the colon</strong> — no healthy segments between lesions, and no disease beyond the large intestine. Which condition does this pattern suggest?</p>","explanation":"<p>UC = <strong>Uniform &amp; Continuous</strong>: inflammation limited to the colon and rectum, starting in the rectum and extending proximally without skipping, in the innermost mucosal lining — bloody diarrhea is its signature. Crohn's is the contrast: <strong>skip lesions</strong> (diseased areas separated by healthy ones) anywhere from mouth to anus. Memory hook: UC is the <strong>steamroller</strong> grinding upward from the rectum; Crohn's is the <strong>guerrilla</strong> striking anywhere in patches. Chant: <strong>“UC = Uniform &amp; Continuous; Crohn's = Crisscross.”</strong></p>","answers":["<p>Crohn's disease</p>","<p>Ulcerative colitis</p>","<p>Diverticulitis</p>","<p>Peptic ulcer disease</p>"],"feedbacks":["","<p>CORRECT — continuous inflammation from the rectum upward, colon/rectum only = ulcerative colitis. Crohn's (A) would show skip lesions and could appear anywhere in the GI tract; diverticulitis (C) is inflamed pouches — usually sigmoid — not continuous mucosal ulcers.</p>","",""]},"correct_response":["b"]},
{"_class":"assessment","id":24025,"assessment_type":"multiple-choice","module":"M5","prompt":{"question":"<p>A client newly diagnosed with celiac disease is reviewing meal choices with the nurse. Which selection shows the best understanding of a gluten-free diet?</p>","explanation":"<p>In celiac disease, gluten (wheat, barley, rye) sets off an autoimmune attack that <strong>flattens the small-intestine villi</strong> — the “shag carpet gets bulldozed to bare tile” — causing malabsorption and the signature <strong>steatorrhea</strong> (fat lost in the stool: pale, greasy, foul-smelling). Management: strict lifelong gluten-free eating. Grilled chicken with rice and steamed vegetables is naturally gluten-free; the other options all ride on wheat, barley, or rye.</p>","answers":["<p>Whole-wheat pasta with garlic bread</p>","<p>Barley-and-vegetable soup with crackers</p>","<p>A rye-bread sandwich</p>","<p>Grilled chicken with rice and steamed vegetables</p>"],"feedbacks":["","","","<p>CORRECT — rice, vegetables, and grilled chicken are naturally gluten-free (wheat, barley, and rye are the banned trio). Untreated celiac damage to the intestinal villi also explains this client's pale, greasy, foul-smelling stools — steatorrhea, fat the damaged gut can't absorb."]},"correct_response":["d"]}
]};
        let answeredQuestions = new Set();

        function smartLinkify(text) {
            if (!text) return "";
            const regex = /((?:href|src)=["'])(https?:\/\/[^"']+)["']|(https?:\/\/[^\s<>"']+)/g;
            let processed = text.replace(regex, (match, prefix, quotedUrl, rawUrl) => {
                if (prefix) return match;
                if (rawUrl) return '<a href="' + rawUrl + '" target="_blank">' + rawUrl + '</a>';
                return match;
            });
            return processed.replace(/\n/g, '<br>');
        }

        function init() {
            const container = document.getElementById('questions-container');
            quizData.questions.forEach((q, index) => {
                container.appendChild(createQuestionCard(q, index + 1));
            });
            setupImageZoom();
            updateStats();
        }

        function updateStats() {
            const total = quizData.questions.length;
            let correct = 0;
            let wrong = 0;

            document.querySelectorAll('.question-card.answered').forEach(card => {
                const hasWrong = card.querySelector('.option.user-wrong');
                if (hasWrong) {
                    wrong++;
                } else {
                    correct++;
                }
            });

            const answered = answeredQuestions.size;
            const remaining = total - answered;
            const score = answered > 0 ? Math.round((correct / total) * 100) : 0;

            document.getElementById('val-score').innerText = score + '%';
            document.getElementById('val-correct').innerText = correct;
            document.getElementById('val-wrong').innerText = wrong;
            document.getElementById('val-remain').innerText = remaining;
        }

        function createQuestionCard(qData, qNum) {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.dataset.id = qData.id;

            const prompt = qData.prompt || {};
            const answers = prompt.answers || [];
            const correctResponses = qData.correct_response || [];
            const feedbacks = qData.feedbacks || prompt.feedbacks || [];

            let overallExplanation = prompt.explanation || "";
            overallExplanation = smartLinkify(overallExplanation);

            const isMulti = correctResponses.length > 1;
            card.dataset.correct = JSON.stringify(correctResponses);
            card.dataset.isMulti = isMulti;

            const modTag = qData.module === 'M4'
                ? '<span class="module-tag mt-m4">MODULE 4 · MSK</span>'
                : (qData.module === 'M5' ? '<span class="module-tag mt-m5">MODULE 5 · GI</span>' : '');

            let optionsHTML = '';
            answers.forEach((ans, idx) => {
                const letter = String.fromCharCode(97 + idx);
                let ansText = typeof ans === 'string' ? ans : (ans.body || ans.content || '');
                let contentFeedback = feedbacks[idx] || "";
                contentFeedback = smartLinkify(contentFeedback);
                const feedbackHtml = contentFeedback ? '<div class="feedback-text">' + contentFeedback + '</div>' : '';

                optionsHTML += `
                    <li class="option" data-idx="${idx}" data-letter="${letter}" onclick="selectOption(this)">
                        <div class="option-content">
                            <span class="chk ${isMulti ? 'checkbox' : 'radio'}"></span>
                            <div style="flex:1">${ansText}</div>
                        </div>
                        ${feedbackHtml}
                    </li>`;
            });

            const qText = prompt.question || prompt.text || '';

            card.innerHTML = `
                <div class="q-header">Question ${qNum} ${modTag}</div>
                <div class="q-body">${qText}</div>
                <ul class="q-answers">${optionsHTML}</ul>
                <div class="btn-submit-container">
                    <button class="btn-submit" onclick="submitAnswer(this)">Answer</button>
                </div>

                <div class="explanation-wrapper">
                    <button class="btn-explain" onclick="toggleExplanation(this)">
                        <i class="fas fa-lightbulb"></i> Explanation
                    </button>
                    <div class="overall-explanation">
                        <h4>Overall Explanation</h4>
                        <div>${overallExplanation}</div>
                    </div>
                </div>
            `;
            return card;
        }

        function selectOption(el) {
            const card = el.closest('.question-card');
            if (card.classList.contains('answered')) return;
            const isMulti = card.dataset.isMulti === 'true';
            if (isMulti) {
                el.classList.toggle('selected');
            } else {
                card.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
                el.classList.add('selected');
            }
        }

        function submitAnswer(btn) {
            const card = btn.closest('.question-card');
            if (card.classList.contains('answered')) return;

            const selectedOpts = card.querySelectorAll('.option.selected');
            if (selectedOpts.length === 0) return;

            card.classList.add('answered');
            answeredQuestions.add(card.dataset.id);
            const correctArr = JSON.parse(card.dataset.correct);
            btn.disabled = true;

            card.querySelectorAll('.option').forEach(opt => {
                const letter = opt.dataset.letter;
                const isCorrect = correctArr.includes(letter);
                const isSelected = opt.classList.contains('selected');

                if (isCorrect) {
                    opt.classList.add('show-correct');
                } else if (isSelected) {
                    opt.classList.add('user-wrong');
                }
            });

            const explanationDiv = card.querySelector('.overall-explanation div');
            if (explanationDiv && explanationDiv.innerHTML.trim() !== '') {
                card.querySelector('.explanation-wrapper').style.display = 'block';
            }

            setupImageZoom();
            updateStats();
        }

        function toggleExplanation(btn) {
            const wrapper = btn.closest('.explanation-wrapper');
            const content = wrapper.querySelector('.overall-explanation');

            if (content.style.display === 'block') {
                content.style.display = 'none';
                btn.innerHTML = '<i class="fas fa-lightbulb"></i> Explanation';
            } else {
                content.style.display = 'block';
                btn.innerHTML = '<i class="fas fa-chevron-up"></i> Hide Explanation';
            }
        }

        function resetQuiz() {
            answeredQuestions.clear();
            document.querySelectorAll('.question-card').forEach(c => {
                c.classList.remove('answered');
                c.querySelectorAll('.option').forEach(o => {
                    o.classList.remove('selected', 'user-wrong', 'show-correct');
                });
                c.querySelector('.btn-submit').disabled = false;

                const wrapper = c.querySelector('.explanation-wrapper');
                if(wrapper) {
                    wrapper.style.display = 'none';
                    const content = wrapper.querySelector('.overall-explanation');
                    if(content) content.style.display = 'none';
                    const btnExp = wrapper.querySelector('.btn-explain');
                    if(btnExp) btnExp.innerHTML = '<i class="fas fa-lightbulb"></i> Explanation';
                }
            });
            updateStats();
            window.scrollTo({top:0, behavior:'smooth'});
        }

        function setupImageZoom() {
            const modal = document.getElementById("imageModal");
            const modalImg = document.getElementById("img01");
            document.querySelectorAll('img').forEach(img => {
                if(img.closest('#imageModal')) return;
                img.onclick = function() {
                    modal.style.display = "block";
                    modalImg.src = this.src;
                }
            });
        }
        function closeModal() { document.getElementById("imageModal").style.display = "none"; }
        window.onclick = function(e) { if (e.target == document.getElementById("imageModal")) closeModal(); }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
